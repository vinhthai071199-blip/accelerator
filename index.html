<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcceleratorAres</title>
<link rel="icon" type="image/jpeg" href="avatar.jpg">
<link rel="apple-touch-icon" href="avatar.jpg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:#0a0c10;color:#e8e4da;font-family:'Poppins',sans-serif;overflow-x:hidden;line-height:1.6}

::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:#0a0c10}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#c8a864,#5c4a26);border-radius:8px}

/* ===== NỀN ===== */
.bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(165deg,#0b0d12,#12151d 46%,#0c0e13)}
.bg .glow{position:absolute;border-radius:50%;opacity:.5}
.glow.g1{width:720px;height:720px;background:radial-gradient(circle,rgba(200,168,100,.2),rgba(200,168,100,.05) 55%,transparent 72%);top:-220px;left:-160px}
.glow.g2{width:560px;height:560px;background:radial-gradient(circle,rgba(96,116,180,.18),rgba(96,116,180,.05) 55%,transparent 72%);top:22%;right:-190px}
.glow.g3{width:680px;height:680px;background:radial-gradient(circle,rgba(200,168,100,.09),transparent 66%);bottom:-260px;left:30%}

/* ===== NAV ===== */
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;gap:16px;padding:20px 6%;transition:.45s cubic-bezier(.22,1,.36,1)}
.nav-links{margin-left:auto}
nav.scrolled{background:rgba(17,20,27,.94);border-bottom:1px solid rgba(200,168,100,.22);padding:12px 6%;box-shadow:0 14px 44px rgba(0,0,0,.45)}
.logo{display:flex;align-items:center}
.logo .logo-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;display:block;border:2px solid rgba(200,168,100,.75);box-shadow:0 0 0 4px rgba(200,168,100,.12),0 0 22px rgba(200,168,100,.35)}
.nav-links{display:flex;gap:10px}
.btn{padding:11px 24px;border-radius:999px;border:1px solid rgba(200,168,100,.45);background:transparent;color:#d4b87a;font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;cursor:pointer;text-decoration:none;transition:.35s cubic-bezier(.22,1,.36,1);display:inline-flex;align-items:center;gap:7px;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;top:0;left:0;width:55%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.25),transparent);transform:translateX(-180%) skewX(-18deg);transition:transform .75s cubic-bezier(.22,1,.36,1);pointer-events:none}
.btn:hover{background:rgba(200,168,100,.12);transform:translateY(-2px);border-color:rgba(200,168,100,.85);box-shadow:0 8px 26px rgba(200,168,100,.18)}
.btn:hover::after{transform:translateX(280%) skewX(-18deg)}
.btn.solid{background:linear-gradient(135deg,#e0c078,#b08c46 55%,#8a6d3b);border:none;color:#161005;box-shadow:0 6px 22px rgba(200,168,100,.28)}
.btn.solid:hover{box-shadow:0 10px 34px rgba(200,168,100,.42)}

/* ===== HEADER ===== */
header{padding:132px 5% 48px;text-align:center;position:relative}
header h1{font-family:'Playfair Display',serif;font-size:clamp(32px,5.4vw,56px);letter-spacing:1.5px;margin-bottom:14px}
header h1 .head-avatar{width:86px;height:86px;border-radius:50%;object-fit:cover;vertical-align:middle;border:3px solid rgba(200,168,100,.8);box-shadow:0 0 0 6px rgba(200,168,100,.12),0 0 46px rgba(200,168,100,.32);margin-right:12px}
header h1 em{font-style:normal;background:linear-gradient(100deg,#f0e2b0,#c8a864 45%,#96762f);-webkit-background-clip:text;background-clip:text;color:transparent}
header .welcome{color:#9a9388;font-weight:300;font-size:15px;letter-spacing:1px}
header .welcome b{color:#c8a864;font-weight:600}

/* ===== SECTION ===== */
section{padding:64px 5% 92px;scroll-margin-top:90px}
.sec-title{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:1200px;margin:0 auto 42px;text-align:center}
.sec-title .bar{width:58px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#c8a864,transparent)}
.sec-title h2{font-family:'Playfair Display',serif;font-size:clamp(24px,3.4vw,34px);letter-spacing:1.2px}
.sec-title h2 em{font-style:normal;color:#c8a864}

/* ===== QUẢNG CÁO SHOP ===== */
.shop-card{max-width:1200px;margin:0 auto;border-radius:18px;overflow:hidden;position:relative;border:1px solid rgba(200,168,100,.35);background:linear-gradient(140deg,rgba(200,168,100,.09),rgba(255,255,255,.03) 42%,rgba(96,116,180,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 24px 70px rgba(0,0,0,.45);display:grid;grid-template-columns:auto 1fr auto;gap:30px;align-items:center;padding:38px;transition:.45s cubic-bezier(.22,1,.36,1)}
.shop-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#c8a864,transparent)}
.shop-card:hover{transform:translateY(-5px);box-shadow:0 34px 90px rgba(0,0,0,.55),0 0 0 1px rgba(200,168,100,.3)}
.shop-card .shop-icon{width:104px;height:104px;border-radius:22px;background:linear-gradient(135deg,#c8a864,#8a6d3b);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 34px rgba(200,168,100,.32);overflow:hidden;border:2px solid rgba(200,168,100,.5)}
.shop-card .shop-icon img{width:100%;height:100%;object-fit:cover;display:block}
.shop-card h3{font-family:'Playfair Display',serif;font-size:25px;letter-spacing:1px;margin-bottom:7px}
.shop-card p{color:#a89f8e;font-size:14px;font-weight:300}
.shop-card .shop-actions{display:flex;flex-direction:column;gap:11px}
@media(max-width:760px){.shop-card{grid-template-columns:1fr;text-align:center;justify-items:center}}

/* ===== VIDEO ===== */
.vid-grid{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:30px}
.vid-card{border-radius:16px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border:1px solid rgba(255,255,255,.09);box-shadow:0 14px 40px rgba(0,0,0,.4);transition:.45s cubic-bezier(.22,1,.36,1)}
.vid-card:hover{transform:translateY(-8px);border-color:rgba(200,168,100,.5);box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(200,168,100,.18)}
.vid-card video{width:100%;display:block;aspect-ratio:16/9;background:#000}
.vid-info{padding:18px 20px 22px}
.vid-info h3{font-size:16px;font-weight:600;margin-bottom:12px;line-height:1.4;word-break:break-word}
.vid-info .meta{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vid-info .meta small{color:#7c7567;font-size:12px}
.vid-dl{display:inline-flex;align-items:center;gap:7px;padding:9px 20px;border-radius:999px;background:linear-gradient(135deg,#e0c078,#b08c46 55%,#8a6d3b);color:#161005;font-size:12px;font-weight:700;text-decoration:none;transition:.3s;box-shadow:0 4px 16px rgba(200,168,100,.22)}
.vid-dl:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(200,168,100,.38)}
.vid-empty{grid-column:1/-1;text-align:center;color:#5c574c;padding:40px 0;font-size:14px}

/* ===== MENU MOBILE ===== */
.menu-btn{display:flex;flex-direction:column;gap:5px;background:none;border:1px solid rgba(200,168,100,.45);border-radius:10px;padding:11px 12px;cursor:pointer}
.menu-btn span{display:block;width:20px;height:2px;background:#d4b87a;border-radius:1px;transition:.3s}
.menu-btn.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-btn.open span:nth-child(2){opacity:0}
.menu-btn.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.menu-overlay{position:fixed;inset:0;z-index:101;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .35s}
.menu-overlay.open{opacity:1;pointer-events:auto}
.menu-panel{position:fixed;top:0;left:0;bottom:0;z-index:102;width:min(290px,82vw);background:#10131a;border-right:1px solid rgba(200,168,100,.3);box-shadow:30px 0 80px rgba(0,0,0,.5);padding:24px 18px;transform:translateX(-110%);transition:transform .45s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;gap:6px}
.menu-panel.open{transform:translateX(0)}
.menu-panel .mp-head{display:flex;align-items:center;gap:12px;padding-bottom:18px;margin-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.menu-panel .mp-head img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid rgba(200,168,100,.7);flex-shrink:0}
.menu-panel .mp-head b{font-family:'Playfair Display',serif;letter-spacing:1px;font-size:16px;flex:1;white-space:nowrap}
.menu-panel .mp-head b em{font-style:normal;color:#c8a864}
.menu-panel .mp-x{margin-left:auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#a8a298;font-size:15px;cursor:pointer;width:34px;height:34px;border-radius:50%;flex-shrink:0;transition:.3s}
.menu-panel .mp-x:hover{color:#ffb4a4;border-color:rgba(255,150,130,.5)}
.menu-panel a{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:10px;color:#e8e4da;text-decoration:none;font-size:15px;transition:.3s}
.menu-panel a:hover{background:rgba(200,168,100,.12)}

/* ===== HIỆU ỨNG XUẤT HIỆN ===== */
.reveal{opacity:0;transform:translateY(40px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal.d1{transition-delay:.1s}

@media(max-width:760px){
  .nav-links .btn{display:none}
  nav{padding:12px 4%;gap:14px;justify-content:flex-start}
  nav>*{min-width:0}
  .logo{white-space:nowrap}
  header{padding:95px 5% 28px}
  header h1{font-size:clamp(26px,7vw,34px)}
  header h1 .head-avatar{width:64px;height:64px}
  .shop-card{padding:22px 18px;gap:18px}
  .shop-card h3{font-size:16px;word-break:break-word}
  .shop-card p{font-size:12.5px;line-height:1.6;word-break:break-word}
  .shop-card .shop-icon{width:88px;height:88px}
  .shop-actions{flex-direction:column;width:100%;max-width:100%}
  .shop-actions .btn{width:100%;justify-content:center;white-space:normal}
  section{padding:60px 4%}
  .sec-title h2{font-size:21px}
  .vid-grid{grid-template-columns:1fr;gap:18px}
}
@media(max-width:760px){
  html,body{overflow-x:hidden}
  body{width:100%;max-width:100vw}
  img{max-width:100%}
}
</style>
</head>
<body>

<div class="bg"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div></div>

<!-- NAV -->
<nav id="navbar">
  <button class="menu-btn" id="menuBtn" onclick="toggleMenu()" aria-label="Menu"><span></span><span></span><span></span></button>
  <div class="logo"><img class="logo-avatar" src="avatar.jpg" alt="avatar"></div>
  <div class="nav-links">
    <a class="btn" href="#shop">Shop</a>
    <!-- TAM AN: <a class="btn" href="#videos">Video</a> -->
  </div>
</nav>
<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="menu-panel" id="menuPanel">
  <div class="mp-head"><img src="avatar.jpg" alt=""><b>Accelerator<em>Ares</em></b><button class="mp-x" onclick="toggleMenu(false)">✕</button></div>
  <a href="#shop" onclick="toggleMenu(false)">Shop</a>
  <!-- TAM AN: <a href="#videos" onclick="toggleMenu(false)">Video</a> -->
</div>

<!-- HEADER -->
<header>
  <h1><img class="head-avatar" src="avatar.jpg" alt=""><em>AcceleratorAres</em></h1>
  <p class="welcome">✦ Chào mừng đến với Bio của Ares ✦</p>
</header>

<!-- ===== MỤC 1: QUẢNG CÁO SHOP ===== -->
<section id="shop">
  <div class="sec-title reveal"><div class="bar"></div><h2>🛒 <em>Teyvat</em> Store</h2></div>
  <div class="shop-card reveal d1">
    <div class="shop-icon"><img src="shop-logo.jpg" alt="Teyvat Store"></div>
    <div>
      <h3>Shop WuWa + Mihoyo — Nạp game giá rẻ</h3>
      <p>Chuyên nạp game WuWa, Genshin, Honkai Star Rail giá rẻ. Nhanh chóng, uy tín. truy cập ngay!</p>
    </div>
    <div class="shop-actions">
      <a class="btn solid" href="https://teyvatstore.com/" target="_blank">🛒 Vào shop: teyvatstore.com</a>
      <a class="btn" href="https://www.facebook.com/people/Teyvat-Store/61589322797808/" target="_blank">💬 Liên hệ CSKH</a>
    </div>
  </div>
</section>

<!-- TAM AN MUC VIDEO - mo lai khi can
===== MỤC 2: VIDEO =====
<section id="videos">
  <div class="sec-title reveal"><div class="bar"></div><h2>🎬 <em>Video</em> Của Tôi</h2></div>
  <div class="vid-grid reveal d1" id="vidGrid"><div class="vid-empty">Đang tải video...</div></div>
</section>
-->

<script>
/* ============ NAV SCROLL ============ */
window.addEventListener('scroll', ()=>{
  document.getElementById('navbar').classList.toggle('scrolled', window.scrollY>40);
});

/* ============ MENU MOBILE ============ */
function toggleMenu(force){
  const p = document.getElementById('menuPanel');
  const b = document.getElementById('menuBtn');
  const o = document.getElementById('menuOverlay');
  const open = force !== undefined ? force : !p.classList.contains('open');
  p.classList.toggle('open', open);
  b.classList.toggle('open', open);
  o.classList.toggle('open', open);
}

/* ============ REVEAL ============ */
const io = new IntersectionObserver(es=>{
  es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); } });
},{threshold:.1});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

/* ============ VIDEO (FIREBASE, ĐỌC CÔNG KHAI) ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCvCjTJ30HSsHv-oM1H4nngEHhzMyqjLtw",
  authDomain: "cinevault-ec9d1.firebaseapp.com",
  databaseURL: "https://cinevault-ec9d1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "cinevault-ec9d1",
  storageBucket: "cinevault-ec9d1.firebasestorage.app",
  messagingSenderId: "732539981440",
  appId: "1:732539981440:web:84403c072905d8afcd6065"
};
function fbLoad(src){
  return new Promise((res,rej)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
}
function esc(s){ const d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
function fmtSize(b){
  if(!b && b!==0) return '';
  const u=['B','KB','MB','GB']; let i=0;
  while(b>=1024 && i<3){ b/=1024; i++; }
  return (b>=10||i===0 ? Math.round(b) : b.toFixed(1))+' '+u[i];
}
async function initVideos(){
  const box = document.getElementById('vidGrid');
  try{
    await fbLoad('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
    await fbLoad('https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js');
    firebase.initializeApp(FIREBASE_CONFIG);
    firebase.database().ref('videos').on('value', function(s){
      const v = s.val();
      if(!v){ box.innerHTML = '<div class="vid-empty">Chưa có video nào.</div>'; return; }
      const list = Object.entries(v).sort(function(a,b){ return (b[1].time||0)-(a[1].time||0); });
      box.innerHTML = list.map(function(v){
        const r = v[1]||{};
        return '<div class="vid-card">'
          + '<video controls preload="metadata" src="'+esc(r.url)+'"></video>'
          + '<div class="vid-info"><h3>'+esc(r.title)+'</h3>'
          + '<div class="meta"><small>'+fmtSize(r.size)+'</small>'
          + '<a class="vid-dl" href="'+esc(r.url)+'" target="_blank" rel="noopener" download>Tải xuống</a>'
          + '</div></div></div>';
      }).join('');
    }, function(){ box.innerHTML = '<div class="vid-empty">Không tải được video.</div>'; });
  }catch(e){ box.innerHTML = '<div class="vid-empty">Không tải được video.</div>'; }
}
initVideos();
</script>
</body>
</html>
