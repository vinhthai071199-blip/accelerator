<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Quản trị — AcceleratorAres</title>
<link rel="icon" type="image/jpeg" href="avatar.jpg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#000;color:#fff;min-height:100vh;padding:24px 5% 60px}
a{color:inherit}
.login-wrap{max-width:380px;margin:12vh auto 0;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:34px 28px}
.login-wrap h1{font-size:20px;margin-bottom:22px;text-align:center;letter-spacing:1px}
.login-wrap h1 em{color:#ffffff;font-style:normal}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#c9c9d1;margin:14px 0 7px}
input{width:100%;padding:13px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#fff;font-size:14px;outline:none}
input:focus{border-color:rgba(255,255,255,.55)}
select{width:100%;padding:13px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:#10131a;color:#fff;font-size:14px;outline:none}
.up-row select{flex:1;min-width:180px;width:auto}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:6px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.solid{background:#e9e9f0;color:#0d0a14;border:none}
.btn.solid:hover{box-shadow:0 6px 18px rgba(0,0,0,.5)}
.ic{width:1.05em;height:1.05em;vertical-align:-0.16em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.full{width:100%;justify-content:center;margin-top:20px}
.err{color:#f87171;font-size:13px;margin-top:14px;text-align:center;min-height:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .brand{font-size:17px;font-weight:700;letter-spacing:.5px}
.topbar .brand em{color:#ffffff;font-style:normal}
.topbar .actions{display:flex;gap:10px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.stat{flex:1;min-width:140px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:16px 18px}
.stat b{display:block;font-size:26px;color:#ffffff}
.stat span{font-size:12.5px;color:#c9c9d1;letter-spacing:.5px}
h2.sec{font-size:17px;margin:30px 0 14px;display:flex;align-items:center;gap:9px}
.item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:15px 18px;margin-bottom:11px}
.item .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.item .who{font-weight:600;font-size:14.5px}
.item p{margin-top:8px;font-size:13.5px;line-height:1.65;color:#e6e6ea;word-break:break-word}
.item .tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:3px;background:rgba(255,255,255,.14);color:#ffffff;margin-left:8px;vertical-align:middle}
.del{padding:6px 13px;border-radius:5px;border:1px solid rgba(248,113,113,.35);background:transparent;color:#f87171;font-size:12.5px;cursor:pointer}
.del:hover{background:rgba(248,113,113,.12)}
.empty{color:#8a8a93;font-size:13.5px;padding:22px 0;text-align:center}
.up-wrap{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:20px;margin-bottom:16px}
.up-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.up-row input[type=text]{flex:1;min-width:180px}
.up-row input[type=file]{padding:10px;font-size:12.5px}
.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:12px;overflow:hidden;display:none}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffffff,#8e8e96)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#8fd694}
.live i{width:8px;height:8px;border-radius:50%;background:#4caf6d;display:inline-block}
/* ===== THE VIDEO GIONG TRANG CHINH ===== */
.vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.vid-card{border-radius:12px;overflow:hidden;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.09)}
.vid-facade{aspect-ratio:16/9;background:#000;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
.vid-facade::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45)}
.vid-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid-play{width:56px;height:56px;border-radius:50%;background:rgba(10,12,16,.45);border:none;color:#ffffff;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.vid-play svg{width:22px;height:22px;fill:currentColor;margin-left:3px}
.vid-note{color:#c9c9d1;font-size:12px;position:relative;z-index:1}
.vid-card video{width:100%;display:block;aspect-ratio:16/9;background:#000}
.vid-info{padding:14px 16px 18px}
.vid-info h3{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.4;word-break:break-word}
.vid-info .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vid-info .meta small{color:#a9a9b2;font-size:12px}
.vid-dl{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border-radius:999px;background:#e9e9f0;color:#0d0a14;font-size:12px;font-weight:700;text-decoration:none}
/* ===== BANG CHON KHO ===== */
.yt-modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.yt-modal.on{display:flex}
.yt-modal .box{width:100%;max-width:430px;background:#10131a;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.yt-modal h3{font-size:16px;margin-bottom:6px}
.yt-modal p{font-size:12.5px;color:#a9a9b2;line-height:1.5;margin-bottom:14px}
.yt-modal .opt{display:flex;flex-direction:column;gap:9px}
.yt-modal .opt .btn{width:100%;justify-content:flex-start;text-align:left}
@media(max-width:600px){.login-wrap{margin-top:8vh}.topbar{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<!-- ===== ĐĂNG NHẬP ===== -->
<div class="login-wrap" id="loginView" style="display:none">
  <h1><em>Quản trị</em> — AcceleratorAres</h1>

    <label>Email</label>
    <input type="email" id="lgEmail" placeholder="admin@gmail.com" required>
    <label>Mật khẩu</label>
    <input type="password" id="lgPass" placeholder="••••••••" required>
    <button class="btn solid full" type="submit"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Đăng nhập</button>
    <div class="err" id="lgErr"></div>

</div>

<!-- ===== NỘI DUNG QUẢN TRỊ ===== -->
<div id="adminView" style="display:none">
  <div class="topbar">
    <div class="brand"><svg class="ic" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> Quản trị <em>AcceleratorAres</em> <span class="live"><i></i>Real-time</span></div>
    <div class="actions">

      <button class="btn" onclick="doLogout()">Đăng xuất</button>
      <a class="btn" href="/">← Về trang chủ</a>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="cntVd">0</b><span>Video</span></div>
    <div class="stat"><b id="cntLk">0</b><span>Links</span></div>
    <div class="stat"><b id="cntPh">0</b><span>Ảnh</span></div>
  </div>

  <h2 class="sec"><svg class="ic" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><polygon points="10 9 15 12 10 15 10 9" fill="currentColor" stroke="none"/></svg> Video của tôi</h2>
  <div class="up-wrap">
    <label style="display:flex;align-items:center;gap:10px;font-size:14px;text-transform:none;letter-spacing:0;color:#fff;margin:0;cursor:pointer">
      <input type="checkbox" id="showVideos" style="width:18px;height:18px;accent-color:#ffffff" onchange="toggleShowVideos(this.checked)">
      Hiện mục Video trên trang chính
    </label>
    <div class="err" id="showErr" style="text-align:left"></div>
  </div>
  <div class="up-wrap">
    <div class="up-row">
      <select id="vidCatSel" data-sec="videos"></select>
      <button class="btn" onclick="addCat('videos','vidCatSel')">Tạo nhóm</button>
      <button class="btn" onclick="renameCat('videos','vidCatSel','videos')">Đổi tên</button>
      <button class="btn" onclick="delCat('videos','vidCatSel','videos')">Xóa nhóm</button>
    </div>
  </div>
  <div class="up-wrap">
    <div class="up-row">
      <input type="text" id="upTitle" placeholder="Tên video...">
      <select id="upHost"><option value="auto">Kho: Tự động</option><option value="cloudinary">Kho: Cloudinary</option><option value="catbox">Kho: Catbox (nhờ up hộ)</option><option value="mediafire">Kho: MediaFire (up tay)</option></select>
      <input type="file" id="upFile" accept="video/*" style="display:none" onchange="if(this.files[0])uploadVideo()">
      <button class="btn solid" id="upBtn" onclick="document.getElementById('upFile').click()"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Tải lên</button>
    </div>
    <div class="prog" id="upProg"><i id="upBar"></i></div>
    <div class="err" id="upErr" style="text-align:left"></div>
  </div>
  <div class="up-wrap">
    <div class="up-row" style="justify-content:space-between">
      <span class="live" id="ytStBadge"><i id="ytDot"></i><span id="ytStTxt">Máy chủ: đang kiểm tra...</span></span>
      <button class="btn" onclick="ytPing()">Kiểm tra lại</button>
    </div>
    <div class="up-row">
      <select id="ytDest"><option value="catbox">Kho: Catbox</option><option value="cloud">Kho: Cloud (tự chia Cloudinary/Catbox)</option><option value="home">Kho: Ổ cứng nhà</option></select>
    </div>
    <div class="up-row">
      <select id="ytRes"><option value="">Độ nét: Cao nhất</option><option value="2160">Độ nét: 4K (2160p)</option><option value="1440">Độ nét: 2K (1440p)</option><option value="1080" selected>Độ nét: 1080p</option><option value="720">Độ nét: 720p</option><option value="480">Độ nét: 480p</option><option value="360">Độ nét: 360p</option></select>
      <select id="ytFps"><option value="">FPS: Cao nhất</option><option value="60" selected>FPS: tối đa 60</option><option value="30">FPS: tối đa 30</option></select>
    </div>
    <div class="up-row">
      <input type="text" id="ytUrl" placeholder="Dán link YouTube (watch / youtu.be / shorts)..." oninput="ytAutoFetch()">
      <button class="btn solid" id="ytBtn" onclick="ytFetch()">Lấy thông tin</button>
    </div>
    <div class="err" id="ytErr" style="text-align:left"></div>
    <div id="ytPrev"></div>
    <div class="up-row" style="margin-top:12px">
      <input type="text" id="ytBase" placeholder="Dán địa chỉ máy chủ ( auto save )" oninput="ytBaseAuto()">
      <button class="btn" onclick="ytBaseDel()">Xóa địa chỉ</button>
    </div>
    <div class="err" id="ytBaseSt" style="text-align:left;color:#8fd694"></div>
  </div>
  <div class="up-wrap">
    <div style="font-size:13.5px;font-weight:600;margin-bottom:10px">Hàng đợi tải</div>
    <div id="ytQList"><div class="empty">Không có việc nào đang chờ.</div></div>
  </div>
  <div id="vdList"></div>

  <h2 class="sec"><svg class="ic" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Links</h2>
  <div class="up-wrap">
    <label style="display:flex;align-items:center;gap:10px;font-size:14px;text-transform:none;letter-spacing:0;color:#fff;margin:0;cursor:pointer">
      <input type="checkbox" id="showLinks" style="width:18px;height:18px;accent-color:#ffffff" onchange="toggleShowLinks(this.checked)">
      Hiện mục Links trên trang chính
    </label>
    <div class="err" id="showLkErr" style="text-align:left"></div>
  </div>
  <div class="up-wrap">
    <div class="up-row">
      <select id="lkCatSel" data-sec="links"></select>
      <button class="btn" onclick="addCat('links','lkCatSel')">Tạo nhóm</button>
      <button class="btn" onclick="renameCat('links','lkCatSel','links')">Đổi tên</button>
      <button class="btn" onclick="delCat('links','lkCatSel','links')">Xóa nhóm</button>
    </div>
  </div>
  <div class="up-wrap">
    <div class="up-row">
      <input type="text" id="lkTitle" placeholder="Tên link...">
      <input type="text" id="lkUrl" placeholder="Link https:// (nếu có sẵn)...">
      <input type="file" id="lkFile" style="display:none" onchange="if(this.files[0])addLink()">
      <select id="lkHost"><option value="auto">Kho: Tự động</option><option value="cloudinary">Kho: Cloudinary</option><option value="catbox">Kho: Catbox (nhờ up hộ)</option><option value="mediafire">Kho: MediaFire (up tay)</option></select>
      <button class="btn solid" id="lkBtn" onclick="addLink()"><svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Thêm</button>
    </div>
    <div class="err" id="lkErr" style="text-align:left"></div>
  </div>
  <div id="lkList"></div>

  <h2 class="sec"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg> Ảnh</h2>
  <div class="up-wrap">
    <label style="display:flex;align-items:center;gap:10px;font-size:14px;text-transform:none;letter-spacing:0;color:#fff;margin:0;cursor:pointer">
      <input type="checkbox" id="showPhotos" style="width:18px;height:18px;accent-color:#ffffff" onchange="toggleShowPhotos(this.checked)">
      Hiện mục Ảnh trên trang chính
    </label>
    <div class="err" id="showPhErr" style="text-align:left"></div>
  </div>
  <div class="up-wrap">
    <div class="up-row">
      <select id="phCatSel" data-sec="photos"></select>
      <button class="btn" onclick="addCat('photos','phCatSel')">Tạo nhóm</button>
      <button class="btn" onclick="renameCat('photos','phCatSel','photos')">Đổi tên</button>
      <button class="btn" onclick="delCat('photos','phCatSel','photos')">Xóa nhóm</button>
    </div>
  </div>
  <div class="up-wrap">
    <div class="up-row">
      <input type="text" id="phTitle" placeholder="Tên ảnh...">
      <input type="text" id="phImg" placeholder="Link ảnh (nếu có sẵn)...">
      <input type="file" id="phFile" accept="image/*" style="display:none" onchange="if(this.files[0])addPhoto()">
      <button class="btn solid" id="phBtn" onclick="addPhoto()"><svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Thêm</button>
    </div>
    <div class="err" id="phErr" style="text-align:left"></div>
  </div>
  <div id="phList"></div>
</div>

<!-- ===== BANG CHON KHO ===== -->
<div class="yt-modal" id="ytDestModal" onclick="if(event.target===this)ytDestClose()">
  <div class="box">
    <h3>Chọn kho cho video</h3>
    <p>Chọn nơi lưu video. "Tải về máy" tải thẳng về máy, không lưu trên ổ cứng máy chủ.</p>
    <div class="opt">
      <button class="btn solid" onclick="ytDestPick('download')">Tải về máy (không lưu kho)</button>
      <button class="btn" onclick="ytDestPick('catbox')">Catbox (tối đa 200MB)</button>
      <button class="btn" onclick="ytDestPick('cloud')">Cloudinary / Cloud</button>
      <button class="btn" onclick="ytDestPick('home')">Ổ cứng nhà</button>
      <button class="btn" onclick="ytDestClose()">Hủy</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCvCjTJ30HSsHv-oM1H4nngEHhzMyqjLtw",
  authDomain: "cinevault-ec9d1.firebaseapp.com",
  databaseURL: "https://cinevault-ec9d1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "cinevault-ec9d1",
  storageBucket: "cinevault-ec9d1.firebasestorage.app",
  messagingSenderId: "732539981440",
  appId: "1:732539981440:web:84403c072905d8afcd6065"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const fbdb = firebase.database();

const FB_DB_URL = "https://cinevault-ec9d1-default-rtdb.asia-southeast1.firebasedatabase.app";
let rtdbOn = null, pollTimer = null;
const FB_TOKEN = { v: null, at: 0 };
const lastJSON = {};

function fbIdToken(){
  const u = firebase.auth().currentUser;
  if(!u) return Promise.resolve(null);
  if(FB_TOKEN.v && Date.now() - FB_TOKEN.at < 300000) return Promise.resolve(FB_TOKEN.v);
  return u.getIdToken().then(function(t){ FB_TOKEN.v = t; FB_TOKEN.at = Date.now(); return t; }, function(){ return null; });
}
function fbAuthUrl(path, t){ return FB_DB_URL + '/' + path + '.json' + (t ? '?auth=' + encodeURIComponent(t) : ''); }
function restOnce(path){
  return fbIdToken().then(function(t){
    return fetch(fbAuthUrl(path, t), {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('http ' + r.status);
      return r.json();
    });
  });
}
function restWrite(op, path, arg){
  return fbIdToken().then(function(t){
    const opt = {method: op === 'set' ? 'PUT' : op === 'update' ? 'PATCH' : op === 'remove' ? 'DELETE' : 'POST'};
    if(op !== 'remove'){ opt.headers = {'Content-Type' : 'application/json'}; opt.body = JSON.stringify(arg === undefined ? null : arg); }
    return fetch(fbAuthUrl(path, t), opt).then(function(r){
      if(!r.ok) throw new Error('http ' + r.status);
      return r.json().catch(function(){ return null; }).then(function(res){
        if(op === 'push'){
          let name = null;
          if(typeof res === 'string'){ const parts = res.replace(/\/+$/,'').split('/'); name = parts[parts.length - 1]; }
          else if(res && res.name){ name = res.name; }
          return { name: name };
        }
        return res;
      });
    });
  });
}
function changed(k, v){ const j = JSON.stringify(v === undefined ? null : v); if(lastJSON[k] === j) return false; lastJSON[k] = j; return true; }
function reloadAll(){
  return Promise.all([
    restOnce('videos').then(function(v){ if(changed('vd', v)){ vdLast = toList(v); renderVd(vdLast); } }),
    restOnce('links').then(function(v){ if(changed('lk', v)){ lkLast = toList(v); renderLk(lkLast); } }),
    restOnce('photos').then(function(v){ if(changed('ph', v)){ phLast = toList(v); renderPh(phLast); } }),
    restOnce('settings/queue').then(function(v){ if(changed('q', v)){ ytQLast = toList(v); renderQ(ytQLast); } }),
    restOnce('settings/showVideos').then(function(v){ if(changed('sv', v)){ const e = document.getElementById('showVideos'); if(e) e.checked = v !== false; } }),
    restOnce('settings/showLinks').then(function(v){ if(changed('sl', v)){ const e = document.getElementById('showLinks'); if(e) e.checked = v !== false; } }),
    restOnce('settings/showPhotos').then(function(v){ if(changed('sp', v)){ const e = document.getElementById('showPhotos'); if(e) e.checked = v !== false; } }),
    restOnce('settings/ytServerBase').then(function(v){ if(changed('base', v)){ const b = v ? String(v).replace(/\/+$/,'') : ''; ytBaseCur = b || YT_SRV; ytBaseApply(b); } }),
    restOnce('cats/videos').then(function(v){ if(changed('cv', v)) fillCatSels('videos', v); }),
    restOnce('cats/links').then(function(v){ if(changed('cl', v)) fillCatSels('links', v); }),
    restOnce('cats/photos').then(function(v){ if(changed('cp', v)) fillCatSels('photos', v); })
  ]).catch(function(){});
}
function startPoll(){ if(pollTimer) return; pollTimer = setInterval(reloadAll, 8000); setTimeout(reloadAll, 0); }
function stopPoll(){ if(pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
function dbDo(op, path, arg){
  const viaRTDB = !!rtdbOn;
  const p = viaRTDB
    ? (op === 'set' ? fbdb.ref(path).set(arg) : op === 'update' ? fbdb.ref(path).update(arg) : op === 'remove' ? fbdb.ref(path).remove() : fbdb.ref(path).push(arg))
    : restWrite(op, path, arg);
  return p.then(function(res){ if(!viaRTDB) reloadAll(); return res; },
               function(e){ if(!viaRTDB) reloadAll(); throw e; });
}
/* Doc realtime qua WebSocket; neu bi chan (vai mang di dong) thi sau 0,3 giay
   tu dong lay lai bang REST HTTPS (kem token dang nhap) — noi dung van hien. */
function dbRefREST(path, cb, errCb){
  let got = false, unsub = null;
  try{
    unsub = fbdb.ref(path).on('value',
      function(s){ got = true; cb(s.val()); },
      function(e){ if(!got && errCb) errCb(e); });
  }catch(e){ if(errCb) errCb(e); return null; }
  setTimeout(function(){
    if(got) return;
    restOnce(path).then(function(j){ if(!got){ got = true; cb(j); } }, function(){ if(!got && errCb) errCb(); });
  }, 300);
  return unsub;
}
/* db.ref(path) tu chon RTDB hay REST tuy tinh trang ket noi WebSocket. */
function mkRef(path){
  return {
    on: function(type, cb, errCb){ return dbRefREST(path, function(v){ cb({ val: function(){ return v; } }); }, errCb); },
    off: function(type, unsub){ try{ fbdb.ref(path).off(type, unsub); }catch(e){} },
    once: function(){
      return {
        then: function(res, rej){
          const inner = rtdbOn ? fbdb.ref(path).once('value')
                               : restOnce(path).then(function(v){ return { val: function(){ return v; } }; });
          return inner.then(res, rej);
        },
        catch: function(rej){ return this.then(null, rej); }
      };
    },
    child: function(p){ return mkRef(path + '/' + p); },
    set: function(v){ return dbDo('set', path, v); },
    update: function(o){ return dbDo('update', path, o); },
    remove: function(){ return dbDo('remove', path); },
    push: function(v){ return dbDo('push', path, v); }
  };
}
const db = { ref: function(path){ return mkRef(path); } };
try{
  fbdb.ref('.info/connected').on('value', function(s){
    const on = (s.val() === true);
    if(on === rtdbOn) return;
    rtdbOn = on;
    if(on) stopPoll(); else startPoll();
  });
}catch(e){ setTimeout(startPoll, 0); }

function catNameOf(r){ return (typeof r==='string') ? (r||'') : ((r&&r.name)||''); }
function fillCatSels(sec, v){
  catCache[sec] = v || {};
  const names = Object.values(catCache[sec]).map(catNameOf).filter(function(n){ return n; }).sort();
  document.querySelectorAll('select[data-sec="'+sec+'"]').forEach(function(sel){
    const cur = sel.value;
    const pick = sel.getAttribute('data-pick');
    sel.innerHTML = '<option value="">— Không nhóm —</option>' + names.map(function(n){ return '<option value="'+esc(n)+'">'+esc(n)+'</option>'; }).join('');
    let want = '';
    if(pick && names.indexOf(pick)!==-1){ want = pick; sel.removeAttribute('data-pick'); }
    else if(names.indexOf(cur)!==-1){ want = cur; }
    sel.value = want;
  });
}
function findCatId(sec, name){
  const all = catCache[sec] || {};
  for(const id of Object.keys(all)){ if(catNameOf(all[id])===name) return id; }
  return null;
}
function addCat(sec, selId){
  const name = (prompt('Tên nhóm mới:','')||'').trim();
  if(!name) return;
  if(findCatId(sec, name)){ alert('Nhóm này đã có!'); return; }
  document.getElementById(selId).setAttribute('data-pick', name);
  db.ref('cats/'+sec).push({name:name})
    .catch(function(e){ alert('Không tạo được: '+e.message); });
}
function renameCat(sec, selId, node){
  const old = document.getElementById(selId).value;
  if(!old){ alert('Chọn nhóm cần đổi tên!'); return; }
  const name = (prompt('Tên mới cho "'+old+'":', old)||'').trim();
  if(!name || name===old) return;
  if(findCatId(sec, name)){ alert('Tên này đã có!'); return; }
  const id = findCatId(sec, old);
  if(!id){ alert('Không tìm thấy nhóm!'); return; }
  document.getElementById(selId).setAttribute('data-pick', name);
  db.ref('cats/'+sec+'/'+id).set({name:name}).then(function(){
    return db.ref(node).once('value');
  }).then(function(s){
    const up = {};
    Object.entries(s.val()||{}).forEach(function([k,r]){ if(((r||{}).cat||'')===old) up[k+'/cat'] = name; });
    if(Object.keys(up).length) return db.ref(node).update(up);
  }).catch(function(e){ alert('Không đổi được: '+e.message); });
}
function delCat(sec, selId, node){
  const old = document.getElementById(selId).value;
  if(!old){ alert('Chọn nhóm cần xóa!'); return; }
  if(!confirm('Xóa nhóm "'+old+'"? Các mục trong nhóm sẽ về Không nhóm.')) return;
  const id = findCatId(sec, old);
  const go = function(){
    return db.ref(node).once('value').then(function(s){
      const up = {};
      Object.entries(s.val()||{}).forEach(function([k,r]){ if(((r||{}).cat||'')===old) up[k+'/cat'] = ''; });
      const p = Object.keys(up).length ? db.ref(node).update(up) : Promise.resolve();
      return p.then(function(){ document.getElementById(selId).value = ''; });
    });
  };
  if(id){ db.ref('cats/'+sec+'/'+id).remove().then(go).catch(function(e){ alert('Không xóa được: '+e.message); }); }
  else go().catch(function(e){ alert('Không xóa được: '+e.message); });
}

function fmtTime(t){

}

  if(lkUnsub){ db.ref('links').off('value', lkUnsub); lkUnsub=null; }
  if(slUnsub){ db.ref('settings/showLinks').off('value', slUnsub); slUnsub=null; }
  if(phUnsub){ db.ref('photos').off('value', phUnsub); phUnsub=null; }
  if(spUnsub){ db.ref('settings/showPhotos').off('value', spUnsub); spUnsub=null; }
  ['videos','links','photos'].forEach(function(sec){
    if(catUnsub[sec]){ db.ref('cats/'+sec).off('value', catUnsub[sec]); catUnsub[sec]=null; }
  });
  if(ytQUnsub){ db.ref('settings/queue').off('value', ytQUnsub); ytQUnsub=null; }
  if(ytBaseUnsub){ db.ref('settings/ytServerBase').off('value', ytBaseUnsub); ytBaseUnsub=null; }
}
function fmtSize(b){
  if(!b && b!==0) return '';
  const u=['B','KB','MB','GB']; let i=0;
  while(b>=1024 && i<3){ b/=1024; i++; }
  return (b>=10||i===0 ? Math.round(b) : b.toFixed(1))+' '+u[i];
}

function homeBase(){

    if(typeof ytBaseCur !== 'undefined' && ytBaseCur && ytBaseCur !== YT_SRV) return String(ytBaseCur).replace(/\/+$/,'');

function upCatbox(f,title,btn,prog,bar,err){
  prog.style.display = 'none';
  btn.disabled = false; btn.innerHTML = IC_UP+' Tải lên';
  err.textContent = 'Catbox chặn trình duyệt đọc kết quả nên không tự up được (file ' + fmtSize(f.size) + '). Gửi đường dẫn file cho admin up hộ nhé!';
}

function uploadVideo(){
  const fi = document.getElementById('upFile');
  const f = fi.files[0];
  const err = document.getElementById('upErr');
  err.textContent = '';
  if(!f){ return; }
  fi.value = '';
  if(f.size > MAX_MB*1024*1024){ err.textContent = 'Video quá lớn! Tối đa '+MAX_MB+'MB (file này '+fmtSize(f.size)+')'; return; }
  if(CLOUD_NAME.indexOf('DANGKY')===0){ err.textContent = 'Chưa cấu hình Cloudinary! Nhờ admin điền Cloud name + Preset.'; return; }
  const title = document.getElementById('upTitle').value.trim() || f.name.replace(/\.[^.]+$/,'');
  const btn = document.getElementById('upBtn');
  btn.disabled = true;
  const prog = document.getElementById('upProg');
  const bar = document.getElementById('upBar');
  prog.style.display = 'block'; bar.style.width = '0';
  const host = document.getElementById('upHost').value;
  if(host === 'mediafire'){
    err.textContent = '';
    prog.style.display = 'none'; btn.disabled = false; btn.innerHTML = IC_UP+' Tải lên';
    alert('Up file trên mediafire.com rồi lấy link dán vào mục Links (nút Thêm) nhé! Mục Video chỉ nhận Cloudinary/Catbox.');
    return;
  }
  if(host === 'cloudinary' && f.size > CL_MAX){
    err.textContent = 'Cloudinary free chỉ nhận tối đa 100MB! Chọn Catbox hoặc nén video lại.';
    prog.style.display = 'none'; btn.disabled = false; btn.innerHTML = IC_UP+' Tải lên'; return;
  }
  if(host === 'catbox' || f.size > CL_MAX){ btn.textContent = 'Đang tải lên Catbox...'; upCatbox(f,title,btn,prog,bar,err); return; }
  let tries = 0;
  (function upOne(){
    tries++;
    btn.textContent = 'Đang tải lên Cloudinary' + (tries>1 ? ' (lần '+tries+')' : '') + '...';
    const fd = new FormData();
    fd.append('file', f);
    fd.append('upload_preset', UPLOAD_PRESET);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/video/upload');
    xhr.upload.onprogress = function(e){
      if(e.lengthComputable) bar.style.width = Math.round(e.loaded/e.total*100)+'%';
    };
    xhr.onload = function(){
      if(xhr.status===200){
        let r = {};
        try{ r = JSON.parse(xhr.responseText); }catch(e){}
        if(!r.secure_url && tries<3){ setTimeout(function(){ upOne(); },1500); return; }
        db.ref('videos').push({title:title, url:r.secure_url, public_id:r.public_id||'', cat:document.getElementById('vidCatSel').value, size:f.size, time:Date.now()}).then(function(){
          document.getElementById('upTitle').value = '';
          prog.style.display = 'none';
          btn.disabled = false; btn.innerHTML = IC_UP+' Tải lên';
        });
      } else if(tries<3){ setTimeout(function(){ upOne(); },1500); }
      else {
        let msg = 'mã '+xhr.status;
        try{ const b = JSON.parse(xhr.responseText); if(b && b.error && b.error.message) msg = b.error.message; }catch(e){}
        err.textContent = 'Tải thất bại ('+msg+')!';
        btn.disabled = false; btn.innerHTML = IC_UP+' Tải lên';
      }
    };
    xhr.onerror = function(){
      if(tries<3){ setTimeout(function(){ upOne(); },1500); }
      else { err.textContent = 'Rớt mạng 3 lần liên tiếp! Bấm Tải lên thử lại nhé.'; btn.disabled=false; btn.innerHTML=IC_UP+' Tải lên'; }
    };
    xhr.send(fd);
  })();
}

/* ============ YOUTUBE: DAN LINK -> XEM TRUOC / TAI FILE / LUU LINK ============
   Luong lay tin: Invidious (co ten + tac gia + do dai + file tron
   hinh+tieng) -> rot xuong noembed (chi ten + tac gia + thumbnail).
   Nut Tai/Up phu thuoc cau noi ben thu ba, luc mo luc dong: duoc thi
   tai ngay, khong thi bao ro chu khong treo. */
const YT_BRIDGE = 'https://invidious.f5.si';
let ytInfo = null;
function ytId(u){
  u = (u||'').trim();
  let m = u.match(/[?&]v=([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  m = u.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  m = u.match(/youtube\.com\/(shorts|embed|live)\/([A-Za-z0-9_-]{11})/);
  if(m) return m[2];
  if(/^[A-Za-z0-9_-]{11}$/.test(u)) return u;
  return '';
}
function ytDur(s){
  s = Math.floor(+s||0);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), r = s%60;
  return (h?h+':':'')+(h?(m<10?'0':''):'')+m+':'+(r<10?'0':'')+r;
}
let ytAutoTimer = null;
function ytAutoFetch(){
  clearTimeout(ytAutoTimer);
  const v = (document.getElementById('ytUrl').value || '').trim();
  if(!ytId(v)) return;
  ytAutoTimer = setTimeout(function(){ if(!ytSending) ytFetch(); }, 700);
}
async function ytFetch(){
  const err = document.getElementById('ytErr');
  const prev = document.getElementById('ytPrev');
  const btn = document.getElementById('ytBtn');
  if(ytSending) return;
  err.textContent = '';
  err.style.color = '';
  ytInfo = null;
  const id = ytId(document.getElementById('ytUrl').value);
  if(!id){ err.textContent = 'Link YouTube không hợp lệ! Dán link watch / youtu.be / shorts.'; return; }
  const watch = 'https://www.youtube.com/watch?v='+id;
  btn.disabled = true; btn.textContent = 'Đang lấy...';
  prev.innerHTML = '<div class="empty">Đang lấy thông tin...</div>';
  ytInfo = null;
  /* noembed truoc (nhanh, ~1s) -> hien ngay; Invidious sau (lay them do dai), timeout 10s */
  try{
    const n = await (await fetch('https://noembed.com/embed?url='+encodeURIComponent(watch))).json();
    if(n && n.title){
      ytInfo = {id:id, title:n.title, author:n.author_name||'', dur:0, thumb:n.thumbnail_url||('https://i.ytimg.com/vi/'+id+'/hqdefault.jpg')};
      btn.disabled = false; btn.textContent = 'Lấy thông tin';
      ytRender();
    }
  }catch(e){}
  try{
    const ctl = new AbortController();
    const to = setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, 10000);
    const r = await (await fetch(YT_BRIDGE+'/api/v1/videos/'+id+'?hl=vi', {signal:ctl.signal})).json();
    clearTimeout(to);
    if(r && r.title){
      const th = (r.videoThumbnails||[]).find(function(t){ return t.quality==='sddefault'; })||{};
      if(ytInfo){
        ytInfo.dur = r.lengthSeconds || ytInfo.dur;
        if(th.url) ytInfo.thumb = th.url;
      } else {
        ytInfo = {id:id, title:r.title||id, author:r.author||'', dur:r.lengthSeconds||0, thumb:th.url||('https://i.ytimg.com/vi/'+id+'/hqdefault.jpg')};
      }
      btn.disabled = false; btn.textContent = 'Lấy thông tin';
      ytRender();
    }
  }catch(e){}
  btn.disabled = false; btn.textContent = 'Lấy thông tin';
  if(!ytInfo){
    err.textContent = 'Không lấy được thông tin. Kiểm tra lại link hoặc mạng rồi thử lại.';
    prev.innerHTML = '';
  }
}
function ytRender(){
  const prev = document.getElementById('ytPrev');
  if(!ytInfo){ prev.innerHTML = ''; return; }
  let h = '<div class="item"><div class="head"><div><span class="who">'+esc(ytInfo.title)+'</span>'
    + (ytInfo.author?'<span class="tag">'+esc(ytInfo.author)+'</span>':'')
    + (ytInfo.dur?'<span class="tag">'+esc(ytDur(ytInfo.dur))+'</span>':'')
    + '</div><div style="display:flex;gap:10px;align-items:center">'
    + '<button class="btn solid" id="ytDlBtn" onclick="ytDestOpen(\'download\')">Tải về</button>'
    + '<button class="btn" id="ytSrvBtn" onclick="ytDestOpen(\'send\')">Gửi về máy chủ</button>'
    + '</div></div>'
    + '<p><img loading="lazy" src="'+esc(ytInfo.thumb)+'" alt="" style="width:100%;max-width:420px;display:block;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:6px"></p>'
    + '<div class="prog" id="ytSndProg"><i id="ytSndBar"></i></div></div>';
  prev.innerHTML = h;
  ytPing();
}

/* ============ YOUTUBE QUA MAY NHA (yt-server) ============
   May chu nha (yt-server) tai bang yt-dlp + ffmpeg roi up kho, tra link.
   - Chon duoc "Do net" (toi da 4K) + "FPS" (toi da 60/30) truoc khi gui;
     2 o nay can may chu ban 10 tro len (badge se nhac), khong chon = ban
     dep nhat. Moc chong ban thap (720p) tu ha xuong theo tran da chon.
   - May chu nay (base 127.0.0.1/localhost) + ONLINE: bam "Gui ve may chu"
     la gui THANG (POST /dl), tai ngay, tu ghi ket qua vao web (videos).
   - Qua mang (tunnel/Tailscale/IP khac): luon gui vao hang doi
     (settings/queue) — may chu poll 15s tu nhan va tai. Khong gui thang
     qua tunnel vi Cloudflare cat ket noi dai ~100s gay bao loi oan.
   - May chu OFFLINE: cung gui vao hang doi, may chu bat lai se tu tai.
   Trang thai ONLINE/OFFLINE hien ro o badge tren cung, tu kiem tra 15s. */
const YT_SRV = 'http://127.0.0.1:8799';
let ytSrvOn = false;
let ytSrvV = 0;
let ytBaseCur = YT_SRV;
let ytPingTimer = null;
let ytSending = false;
function ytBaseApply(v){
  const bi = document.getElementById('ytBase');
  const st = document.getElementById('ytBaseSt');
  const prev = ytBaseLast;
  ytBaseLast = v;
  if(!bi){ if(st) st.textContent = ''; return; }
  const cur = (bi.value || '').trim().replace(/\/+$/,'');
  if(document.activeElement === bi && cur && cur !== v) return;
  if(bi.value !== v) bi.value = v;
  if(st && prev !== v) st.textContent = v
    ? ('Địa chỉ máy chủ lấy tự động lúc ' + new Date().toLocaleTimeString('vi-VN'))
    : 'Chưa có địa chỉ máy chủ chung — trang sẽ thử máy 127.0.0.1 khi mở trên máy nhà.';
}
async function ytPing(){
  let base = YT_SRV;
  try{
    const s = await db.ref('settings/ytServerBase').once('value');
    if(s.val()) base = String(s.val()).replace(/\/+$/,'');
  }catch(e){}
  ytBaseCur = base;
  ytBaseApply(base === YT_SRV ? '' : base);
  let j = {};
  try{
    const r = await fetch(base+'/ping');
    j = r.ok ? await r.json() : {};
  }catch(e){ j = {}; }
  ytSrvOn = !!j.ok;
  ytSrvV = j.v || 0;
  const bd = document.getElementById('ytStBadge');
  const dot = document.getElementById('ytDot');
  const tx = document.getElementById('ytStTxt');
  if(bd && dot && tx){
    if(ytSrvOn){
      bd.style.color = '#8fd694';
      dot.style.background = '#4caf6d';
      tx.textContent = 'Máy chủ: ONLINE' + (j.busy ? ' (đang bận)' : '')
        + (ytLocalBase() ? ' — máy này, gửi là tải ngay' : ' — qua mạng, gửi sẽ vào hàng đợi tải')
        + (ytSrvV && ytSrvV < 10 ? ' — máy nhà bản ' + ytSrvV + ', cần bản 10 (chọn độ nét/FPS)!' : '');
    } else {
      bd.style.color = '#f87171';
      dot.style.background = '#f87171';
      tx.textContent = 'Máy chủ: OFFLINE — gửi sẽ xếp hàng, máy bật sẽ tự tải';
    }
  }
}
let ytBaseTimer = null;
let ytBaseLast = null;
async function ytBaseLoad(){
  try{
    const s = await db.ref('settings/ytServerBase').once('value');
    ytBaseApply(s.val() ? String(s.val()).replace(/\/+$/,'') : '');
  }catch(e){}
}
async function ytBaseAuto(){
  const inp = document.getElementById('ytBase');
  const st = document.getElementById('ytBaseSt');
  const v = (inp.value || '').trim().replace(/\/+$/,'');
  if(v && !/^https?:\/\//i.test(v)){ if(st) st.textContent = 'Địa chỉ phải bắt đầu bằng http:// hoặc https:// — chưa lưu.'; return; }
  if(v === ytBaseLast) return;
  clearTimeout(ytBaseTimer);
  ytBaseTimer = setTimeout(async function(){
    try{
      await db.ref('settings/ytServerBase').set(v);
      ytBaseLast = v;
      if(st) st.textContent = v ? ('Đã tự lưu lúc ' + new Date().toLocaleTimeString('vi-VN')) : 'Đã xóa địa chỉ máy chủ chung.';
      ytPing();
    }catch(e){
      if(st) st.textContent = 'Không lưu được (' + (e.code || '') + '). Kiểm tra Rules rồi Publish.';
    }
  }, 1200);
}
function ytBaseDel(){
  const inp = document.getElementById('ytBase');
  if(!inp.value && !ytBaseLast) return;
  if(!confirm('Xóa địa chỉ máy chủ chung? Mọi admin sẽ về dùng máy của mình (localhost).')) return;
  inp.value = '';
  ytBaseAuto();
}
function ytLocalBase(){
  try{ const u = new URL(ytBaseCur); return u.hostname === '127.0.0.1' || u.hostname === 'localhost'; }catch(e){ return false; }
}
function ytPushQueue(url, dest, cat, qres, qfps){
  const err = document.getElementById('ytErr');
  const info = ytInfo;
  db.ref('settings/queue').push({url:url, title:(info && info.title) || 'YouTube video', author:(info && info.author) || '', thumb:(info && info.thumb) || '', dur:(info && info.dur) || 0, dest:dest, cat:cat, res:qres||0, fps:qfps||0, time:Date.now(), stage:'new', pct:0}).then(function(){
    if(ytInfo === info){
      document.getElementById('ytUrl').value = '';
      document.getElementById('ytPrev').innerHTML = '';
      ytInfo = null;
    }
    err.style.color = '#8fd694';
    err.textContent = ytSrvOn
      ? 'Đã gửi! Máy chủ đang bật sẽ nhận việc trong khoảng 15 giây — xem tiến trình ở Hàng đợi tải bên dưới.'
      : 'Máy chủ đang tắt — đã xếp vào hàng đợi, máy chủ bật lên là tự tải ngay (xem Hàng đợi tải bên dưới).';
  }).catch(function(e){
    err.textContent = 'Không gửi được ('+(e.code||'')+'). Kiểm tra mạng rồi thử lại.';
  });
}
function ytQueue(){
  const err = document.getElementById('ytErr');
  err.textContent = '';
  err.style.color = '';
  if(!ytInfo || ytSending) return;
  const url = 'https://www.youtube.com/watch?v='+ytInfo.id;
  const dest = ((document.getElementById('ytDest')||{}).value||'cloud');
  const cat = document.getElementById('vidCatSel').value;
  const qres = parseInt(((document.getElementById('ytRes')||{}).value)||'0', 10) || 0;
  const qfps = parseInt(((document.getElementById('ytFps')||{}).value)||'0', 10) || 0;
  document.getElementById('ytUrl').value = '';
  document.getElementById('ytPrev').innerHTML = '';
  if(ytSrvOn && ytLocalBase()){ ytSendDirect(url, dest, cat, qres, qfps); return; }
  ytPushQueue(url, dest, cat, qres, qfps);
}
async function ytSendDirect(url, dest, cat, qres, qfps){
  const err = document.getElementById('ytErr');
  const btn = document.getElementById('ytSrvBtn');
  const info = ytInfo;
  ytSending = true;
  if(btn){ btn.disabled = true; btn.textContent = 'Đang gửi về máy chủ...'; }
  err.textContent = 'Đang gửi về máy chủ...';
  const prog = document.getElementById('ytSndProg');
  const bar = document.getElementById('ytSndBar');
  if(prog) prog.style.display = 'block';
  const iv = setInterval(async function(){
    try{
      const p = await (await fetch(ytBaseCur+'/progress')).json();
      if(!p.busy) return;
      const pc = Math.max(0, Math.min(99, Math.round(p.pct||0)));
      if(p.stage === 'up'){
        err.textContent = 'Máy chủ đang đưa lên kho... ' + (p.detail||'');
        if(bar) bar.style.width = '99%';
      } else {
        err.textContent = 'Máy chủ đang tải video về: ' + pc + '%';
        if(bar) bar.style.width = pc + '%';
      }
    }catch(e){}
  }, 2000);
  let j = null, netErr = false;
  try{
    const r = await fetch(ytBaseCur+'/dl', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url:url, dest:dest, res:qres||0, fps:qfps||0})});
    j = await r.json().catch(function(){ return {}; });
    if(!r.ok || !j.ok){ err.textContent = j.error || ('Máy chủ trả lỗi ' + r.status + ', thử lại sau.'); j = null; }
  }catch(e){ netErr = true; }
  clearInterval(iv);
  ytSending = false;
  if(btn){ btn.disabled = false; btn.textContent = 'Gửi về máy chủ'; }
  if(prog) prog.style.display = 'none';
  if(bar) bar.style.width = '0%';
  ytPing();
  if(netErr){
    let busyNow = false;
    try{ const p = await (await fetch(ytBaseCur+'/ping')).json(); busyNow = !!p.busy; }catch(e){}
    if(busyNow){
      err.textContent = 'Kết nối bị ngắt nhưng máy chủ VẪN ĐANG chạy việc (đừng gửi lại) — video sẽ hiện trong "Video của tôi" sau ít phút.';
      return;
    }
    err.textContent = 'Mất kết nối trực tiếp — đang chuyển sang hàng đợi...';
    ytPushQueue(url, dest, cat, qres, qfps);
    return;
  }
  if(!j) return;
  try{
    const entry = {title:(info && info.title) || 'YouTube video', time:Date.now(), cat:cat||''};
    if(j.host === 'home'){
      entry.host = 'home'; entry.path = j.path || ''; entry.poster = j.poster || ''; entry.url = ''; entry.size = j.bytes || 0;
    } else {
      entry.host = j.host || 'cloudinary'; entry.url = j.url; entry.public_id = j.public_id || ''; entry.del = j.del || ''; entry.size = j.bytes || 0;
    }
    await db.ref('videos').push(entry);
    if(ytInfo === info){
      document.getElementById('ytUrl').value = '';
      document.getElementById('ytPrev').innerHTML = '';
      ytInfo = null;
    }
    err.style.color = '#8fd694';
    err.textContent = 'Xong! Máy chủ đã tải xong và video đã lên web.';
  }catch(e){
    err.textContent = 'Video đã tải xong ở máy nhà nhưng chưa ghi được lên web (lỗi: ' + (e.code || e.message || '') + ') — thử bấm gửi lại lần nữa.';
  }
}

function ytDownloadDirect(){
  const err = document.getElementById('ytErr');
  const btn = document.getElementById('ytDlBtn');
  if(!ytInfo || ytSending) return;
  if(!ytSrvOn){ err.style.color = '#f87171'; err.textContent = 'Máy chủ đang offline — bật yt-server rồi thử lại.'; return; }
  const url = 'https://www.youtube.com/watch?v='+ytInfo.id;
  const qres = parseInt(((document.getElementById('ytRes')||{}).value)||'0', 10) || 0;
  const qfps = parseInt(((document.getElementById('ytFps')||{}).value)||'0', 10) || 0;
  ytSending = true;
  if(btn){ btn.disabled = true; btn.textContent = 'Đang tải...'; }
  err.style.color = '';
  err.textContent = 'Đang gửi lệnh tải về máy...';
  const prog = document.getElementById('ytSndProg');
  const bar = document.getElementById('ytSndBar');
  if(prog) prog.style.display = 'block';
  const iv = setInterval(async function(){
    try{
      const p = await (await fetch(ytBaseCur+'/progress')).json();
      if(!p.busy) return;
      const pc = Math.max(0, Math.min(99, Math.round(p.pct||0)));
      if(p.stage === 'up'){
        err.textContent = 'Máy chủ đang chuẩn bị file... ' + (p.detail||'');
        if(bar) bar.style.width = '99%';
      } else {
        err.textContent = 'Máy chủ đang tải video về: ' + pc + '%';
        if(bar) bar.style.width = pc + '%';
      }
    }catch(e){}
  }, 2000);
  fetch(ytBaseCur+'/dl', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url:url, dest:'download', res:qres||0, fps:qfps||0})})
  .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, status:r.status, j:j}; }); })
  .then(function(x){
    clearInterval(iv);
    if(!x.ok || !x.j.ok){ err.style.color = '#f87171'; err.textContent = x.j.error || ('Máy chủ trả lỗi '+x.status+', thử lại sau.'); return; }
    err.style.color = '#8fd694';
    err.textContent = 'Đang tải file về máy...';
    const link = ytBaseCur + x.j.url;
    const a = document.createElement('a');
    a.href = link;
    a.download = x.j.name || '';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ try{ a.remove(); }catch(e){} }, 5000);
    setTimeout(function(){ if(err.textContent === 'Đang tải file về máy...') err.textContent = 'Đã gửi lệnh tải. Kiểm tra thư mục Downloads.'; }, 2500);
  })
  .catch(function(){
    clearInterval(iv);
    err.style.color = '#f87171'; err.textContent = 'Mất kết nối máy chủ, thử lại.';
  })
  .then(function(){
    ytSending = false;
    if(btn){ btn.disabled = false; btn.textContent = 'Tải về'; }
    if(prog) prog.style.display = 'none';
    if(bar) bar.style.width = '0%';
  });
}

/* Tai file khong phai Cloudinary (Catbox / o cung): fetch ve blob roi
   save (trinh duyet tu mo hop luu). Loi (may nha tat, CORS) -> mo tab moi. */
async function dlFile(el){
  const url = el.getAttribute('data-url'), name = el.getAttribute('data-name') || 'video.mp4';
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('bad');
    const b = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); if(a.parentNode) a.parentNode.removeChild(a); }, 5000);
  }catch(e){ window.open(url, '_blank', 'noopener'); }
  return false;
}
function loadVid(el){
  var url = el.getAttribute('data-url');
  if(!url) return;
  var v = document.createElement('video');
  v.controls = true; v.preload = 'metadata'; v.src = url;
  var poster = el.getAttribute('data-poster');
  if(poster) v.poster = poster;
  v.style.cssText = 'width:100%;display:block;aspect-ratio:16/9;background:#000';
  el.parentNode.replaceChild(v, el);
  var p = v.play(); if(p && p.catch) p.catch(function(){});
}

function cloudDelete(token){
  if(!token) return Promise.resolve();
  const fd = new FormData();
  fd.append('token', token);
  return fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/delete_by_token', {method:'POST', body:fd}).catch(function(){}).then(function(){});
}

function addLink(){
  const title = document.getElementById('lkTitle').value.trim();
  const url = document.getElementById('lkUrl').value.trim();
  const fi = document.getElementById('lkFile');
  const f = fi.files[0];
  const host = document.getElementById('lkHost').value;
  const err = document.getElementById('lkErr');
  err.textContent = '';
  if(!title){ err.textContent = 'Nhập tên link!'; return; }
  const btn = document.getElementById('lkBtn');
  if(!f && !url){
    if(!url){ fi.click(); return; }
  }
  fi.value = '';
  if(!f){
    if(!url || !/^https?:\/\//i.test(url)){ err.textContent = 'Link phải bắt đầu bằng http:// hoặc https://'; return; }
    return saveLink(url);
  }
  if(host === 'mediafire'){
    alert('Up file trên mediafire.com rồi lấy link dán vào ô Link nhé! Mục này chỉ nhận link.');
    fi.click(); return;
  }
  const isImg = f.type.indexOf('image/') === 0;
  const isVid = f.type.indexOf('video/') === 0;
  if(host === 'cloudinary' || (host === 'auto' && ((isImg && f.size <= 10*1024*1024) || (isVid && f.size <= CL_MAX)))){
    if(!isImg && !isVid){ err.textContent = 'Cloudinary chỉ nhận ảnh/video! File này chọn Catbox hoặc MediaFire.'; return; }
    if(isImg && f.size > 10*1024*1024){ err.textContent = 'Ảnh quá 10MB! Chọn Catbox hoặc MediaFire.'; return; }
    if(isVid && f.size > CL_MAX){ err.textContent = 'Video quá 100MB! Chọn Catbox hoặc MediaFire.'; return; }
    return upLinkFile(f, isImg ? 'image' : 'video');
  }
  err.textContent = 'File này (' + fmtSize(f.size) + ') trình duyệt không tự up được. Gửi đường dẫn file cho admin up hộ, hoặc up tay lên MediaFire rồi dán link!';
  function saveLink(u){
    btn.disabled = true; btn.textContent = 'Đang thêm...';
    db.ref('links').push({title:title, url:u, cat:document.getElementById('lkCatSel').value, time:Date.now()}).then(function(){
      document.getElementById('lkTitle').value = '';
      document.getElementById('lkUrl').value = '';
      btn.disabled = false; btn.innerHTML = IC_ADD+' Thêm';
    }).catch(function(e){
      err.textContent = 'Không lưu được ('+e.code+'). Kiểm tra Rules rồi Publish.';
      btn.disabled = false; btn.innerHTML = IC_ADD+' Thêm';
    });
  }
  function upLinkFile(file, kind){
    btn.disabled = true; btn.textContent = 'Đang tải...';
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', UPLOAD_PRESET);
    fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/'+kind+'/upload', {method:'POST', body:fd})
      .then(function(r){ if(!r.ok) throw new Error('http-'+r.status); return r.json(); })
      .then(function(r){
        document.getElementById('lkTitle').value = '';
        document.getElementById('lkUrl').value = '';
        btn.disabled = false; btn.innerHTML = IC_ADD+' Thêm';
        db.ref('links').push({title:title, url:r.secure_url, cat:document.getElementById('lkCatSel').value, time:Date.now()});
      })
      .catch(function(){ err.textContent = 'Tải file thất bại!'; btn.disabled=false; btn.innerHTML=IC_ADD+' Thêm'; });
  }
}

const PH_MAX_MB = 10;
function renderPh(list){
  list = list || phLast || [];
  document.getElementById('cntPh').textContent = list.length;
  const box = document.getElementById('phList');
  if(!list.length){ box.innerHTML = '<div class="empty">Chưa có ảnh nào. Thêm ảnh đầu tiên nhé!</div>'; return; }
  box.innerHTML = '<div class="vid-grid">' + list.map(function(x){
    const k=x[0], r=x[1]||{};
    phCache[k] = {title: r.title||'', del: r.del||''};
    const hdP = !!r.hidden;
    return '<div class="vid-card"'+(hdP?' style="opacity:.55"':'')+'>'
      + '<a href="'+esc(r.img)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(r.img)+'" alt="" style="width:100%;display:block;aspect-ratio:16/10;object-fit:cover;background:#000"></a>'
      + '<div class="vid-info">'
      + (r.cat?'<span class="tag">'+esc(r.cat)+'</span> ':'')
      + (hdP?'<span class="tag">ĐÃ ẨN</span> ':'')
      + '<h3>'+esc(r.title)+'</h3>'
      + '<div class="meta"><small>'+fmtTime(r.time)+'</small>'
      + '<button class="del" onclick="editPhoto(\''+k+'\')">Sửa tên</button>'
      + '<button class="del" onclick="toggleHide(\'photos\',\''+k+'\','+(hdP?'true':'false')+')">'+(hdP?'Hiện':'Ẩn')+'</button>'
      + '<button class="del" onclick="delPhoto(\''+k+'\')">Xóa</button>'
      + '</div></div></div>';
  }).join('') + '</div>';
}

function delPhoto(key){
  if(!confirm('Xóa ảnh này khỏi web VÀ khỏi kho Cloudinary?')) return;
  const rec = phCache[key] || {};
  cloudDelete(rec.del || '').then(function(){
    db.ref('photos/'+key).remove()
      .catch(function(e){ alert('Không xóa được: '+e.message); });
  });
}

function editPhoto(key){
  const cur = (phCache[key] && phCache[key].title) || '';
  const name = prompt('Tên ảnh mới:', cur);
  if(name === null) return;
  const t = name.trim();
  if(!t){ alert('Tên không được để trống!'); return; }
  if(t === cur) return;
  db.ref('photos/'+key+'/title').set(t)
    .catch(function(e){ alert('Không sửa được: '+e.message); });
}

function toggleShowPhotos(on){
  const err = document.getElementById('showPhErr');
  err.textContent = '';
  db.ref('settings/showPhotos').set(!!on).catch(function(e){
    err.textContent = 'Không lưu được ('+e.code+'). Kiểm tra Rules đã có "settings" và "photos" chưa rồi Publish.';
    document.getElementById('showPhotos').checked = !on;
  });
}

function addPhoto(){
  const title = document.getElementById('phTitle').value.trim();
  const imgUrl = document.getElementById('phImg').value.trim();
  const fi = document.getElementById('phFile');
  const f = fi.files[0];
  const err = document.getElementById('phErr');
  err.textContent = '';
  if(!title){ err.textContent = 'Nhập tên ảnh!'; return; }
  if(!f && !imgUrl){ fi.click(); return; }
  fi.value = '';
  if(f && f.size > PH_MAX_MB*1024*1024){ err.textContent = 'Ảnh quá lớn! Tối đa '+PH_MAX_MB+'MB'; return; }
  const btn = document.getElementById('phBtn');
  btn.disabled = true; btn.textContent = 'Đang thêm...';
  function save(img){
    db.ref('photos').push({title:title, img:img, cat:document.getElementById('phCatSel').value, time:Date.now()}).then(function(){
      document.getElementById('phTitle').value = '';
      document.getElementById('phImg').value = '';
      fi.value = '';
      btn.disabled = false; btn.innerHTML = IC_ADD+' Thêm';
    }).catch(function(e){
      err.textContent = 'Không lưu được ('+e.code+'). Kiểm tra Rules đã có "photos" chưa rồi Publish.';
      btn.disabled = false; btn.innerHTML = IC_ADD+' Thêm';
    });
  }
  if(!f){ save(imgUrl); return; }
  const fd = new FormData();
  fd.append('file', f);
  fd.append('upload_preset', UPLOAD_PRESET);
  fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/image/upload', {method:'POST', body:fd})
    .then(function(r){ if(!r.ok) throw new Error('http-'+r.status); return r.json(); })
    .then(function(r){ save(r.secure_url); })
    .catch(function(){ err.textContent = 'Tải ảnh thất bại! Kiểm tra Cloud name + Preset.'; btn.disabled=false; btn.innerHTML=IC_ADD+' Thêm'; });
}

function showLogin(){ document.getElementById('loginView').style.display='block'; document.getElementById('adminView').style.display='none'; stopListeners(); }
function showAdmin(){ document.getElementById('loginView').style.display='none'; document.getElementById('adminView').style.display='block'; startListeners(); ytBaseLoad(); ytPing(); if(!ytPingTimer) ytPingTimer = setInterval(ytPing, 15000); }

function doLogin(e){
  e.preventDefault();
  const err = document.getElementById('lgErr');
  err.textContent='';
  auth.signInWithEmailAndPassword(document.getElementById('lgEmail').value.trim(), document.getElementById('lgPass').value)
    .catch(ex => { err.textContent = 'Sai email hoặc mật khẩu! ('+ex.code+')'; });
}
function doLogout(){ auth.signOut(); }

function changePass(){
  const user = auth.currentUser;
  if(!user){ alert('Bạn chưa đăng nhập!'); return; }
  const cur = prompt('Nhập mật khẩu hiện tại:');
  if(!cur) return;
  const nw = prompt('Mật khẩu mới (tối thiểu 6 ký tự):');
  if(!nw) return;
  if(nw.length < 6){ alert('Mật khẩu mới phải từ 6 ký tự!'); return; }
  const cf = prompt('Nhập lại mật khẩu mới:');
  if(cf !== nw){ alert('Hai mật khẩu mới không khớp!'); return; }
  const cred = firebase.auth.EmailAuthProvider.credential(user.email, cur);
  user.reauthenticateWithCredential(cred).then(function(){
    return user.updatePassword(nw);
  }).then(function(){
    alert('Đổi mật khẩu xong! Lần sau đăng nhập bằng pass mới.');
  }).catch(function(e){
    alert('Không đổi được (' + (e.code || '') + '): ' + (e.message || 'sai mật khẩu hiện tại?'));
  });
}

auth.onAuthStateChanged(u => { u ? showAdmin() : showLogin(); });
</script>
