<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Quản trị — AcceleratorAres</title>
<link rel="icon" type="image/jpeg" href="avatar.jpg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0c10;color:#e8e4da;min-height:100vh;padding:24px 5% 60px}
a{color:inherit}
.login-wrap{max-width:380px;margin:12vh auto 0;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:34px 28px}
.login-wrap h1{font-size:20px;margin-bottom:22px;text-align:center;letter-spacing:1px}
.login-wrap h1 em{color:#c8a864;font-style:normal}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#9a937f;margin:14px 0 7px}
input{width:100%;padding:13px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#fff;font-size:14px;outline:none}
input:focus{border-color:rgba(200,168,100,.55)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:6px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#e8e4da;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.solid{background:linear-gradient(135deg,#e0c078,#c8a864);color:#0a0c10;border:none}
.btn.solid:hover{box-shadow:0 6px 18px rgba(0,0,0,.5)}
.ic{width:1.05em;height:1.05em;vertical-align:-0.16em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.full{width:100%;justify-content:center;margin-top:20px}
.err{color:#ff8080;font-size:13px;margin-top:14px;text-align:center;min-height:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .brand{font-size:17px;font-weight:700;letter-spacing:.5px}
.topbar .brand em{color:#c8a864;font-style:normal}
.topbar .actions{display:flex;gap:10px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.stat{flex:1;min-width:140px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:16px 18px}
.stat b{display:block;font-size:26px;color:#c8a864}
.stat span{font-size:12.5px;color:#9a937f;letter-spacing:.5px}
h2.sec{font-size:17px;margin:30px 0 14px;display:flex;align-items:center;gap:9px}
.item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:15px 18px;margin-bottom:11px}
.item .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.item .who{font-weight:600;font-size:14.5px}
.item .when{color:#7c7567;font-size:12px}
.stars{color:#c8a864;font-size:14px;letter-spacing:2px}
.item p{margin-top:8px;font-size:13.5px;line-height:1.65;color:#cfc9bb;word-break:break-word}
.item .tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:3px;background:rgba(200,168,100,.14);color:#c8a864;margin-left:8px;vertical-align:middle}
.del{padding:6px 13px;border-radius:5px;border:1px solid rgba(255,120,120,.35);background:transparent;color:#ff9090;font-size:12.5px;cursor:pointer}
.del:hover{background:rgba(255,120,120,.12)}
.empty{color:#5c574c;font-size:13.5px;padding:22px 0;text-align:center}
.up-wrap{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:20px;margin-bottom:16px}
.up-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.up-row input[type=text]{flex:1;min-width:180px}
.up-row input[type=file]{padding:10px;font-size:12.5px}
.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:12px;overflow:hidden;display:none}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c8a864,#8a6d3b)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#8fd694}
.live i{width:8px;height:8px;border-radius:50%;background:#4caf6d;display:inline-block}
/* ===== THE VIDEO GIONG TRANG CHINH ===== */
.vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.vid-card{border-radius:12px;overflow:hidden;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.09)}
.vid-facade{aspect-ratio:16/9;background:#000;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
.vid-facade::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45)}
.vid-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid-play{width:56px;height:56px;border-radius:50%;background:rgba(10,12,16,.45);border:none;color:#e0c078;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.vid-play svg{width:22px;height:22px;fill:currentColor;margin-left:3px}
.vid-note{color:#9a9388;font-size:12px;position:relative;z-index:1}
.vid-card video{width:100%;display:block;aspect-ratio:16/9;background:#000}
.vid-info{padding:14px 16px 18px}
.vid-info h3{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.4;word-break:break-word}
.vid-info .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vid-info .meta small{color:#7c7567;font-size:12px}
.vid-dl{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border-radius:999px;background:#c8a864;color:#0a0c10;font-size:12px;font-weight:700;text-decoration:none}
@media(max-width:600px){.login-wrap{margin-top:8vh}.topbar{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>

<!-- ===== ĐĂNG NHẬP ===== -->
<div class="login-wrap" id="loginView" style="display:none">
  <h1><em>Quản trị</em> — AcceleratorAres</h1>
  <form onsubmit="doLogin(event)">
    <label>Email</label>
    <input type="email" id="lgEmail" placeholder="admin@gmail.com" required>
    <label>Mật khẩu</label>
    <input type="password" id="lgPass" placeholder="••••••••" required>
    <button class="btn solid full" type="submit"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Đăng nhập</button>
    <div class="err" id="lgErr"></div>
  </form>
</div>

<!-- ===== NỘI DUNG QUẢN TRỊ ===== -->
<div id="adminView" style="display:none">
  <div class="topbar">
    <div class="brand"><svg class="ic" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> Quản trị <em>AcceleratorAres</em> <span class="live"><i></i>Real-time</span></div>
    <div class="actions">
      <button class="btn" onclick="doLogout()">Đăng xuất</button>
      <a class="btn" href="/">← Về trang chủ</a>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="cntFb">0</b><span>Phản hồi</span></div>
    <div class="stat"><b id="cntRq">0</b><span>Yêu cầu</span></div>
    <div class="stat"><b id="cntVd">0</b><span>Video</span></div>
    <div class="stat"><b id="cntLk">0</b><span>Links</span></div>
  </div>

  <h2 class="sec"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Phản hồi khách</h2>
  <div id="fbList"></div>

  <h2 class="sec"><svg class="ic" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg> Yêu cầu khách</h2>
  <div id="rqList"></div>

  <h2 class="sec"><svg class="ic" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><polygon points="10 9 15 12 10 15 10 9" fill="currentColor" stroke="none"/></svg> Video của tôi</h2>
  <div class="up-wrap">
    <label style="display:flex;align-items:center;gap:10px;font-size:14px;text-transform:none;letter-spacing:0;color:#e8e4da;margin:0;cursor:pointer">
      <input type="checkbox" id="showVideos" style="width:18px;height:18px;accent-color:#c8a864" onchange="toggleShowVideos(this.checked)">
      Hiện mục Video trên trang chính
    </label>
    <div class="err" id="showErr" style="text-align:left"></div>
  </div>
  <div class="up-wrap">
    <div class="up-row">
      <input type="text" id="upTitle" placeholder="Tên video...">
      <input type="file" id="upFile" accept="video/*">
      <button class="btn solid" id="upBtn" onclick="uploadVideo()"><svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Tải lên</button>
    </div>
    <div class="prog" id="upProg"><i id="upBar"></i></div>
    <div class="err" id="upErr" style="text-align:left"></div>
  </div>
  <div id="vdList"></div>

  <h2 class="sec"><svg class="ic" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Link & ảnh</h2>
  <div class="up-wrap">
    <label style="display:flex;align-items:center;gap:10px;font-size:14px;text-transform:none;letter-spacing:0;color:#e8e4da;margin:0;cursor:pointer">
      <input type="checkbox" id="showLinks" style="width:18px;height:18px;accent-color:#c8a864" onchange="toggleShowLinks(this.checked)">
      Hiện mục Links trên trang chính
    </label>
    <div class="err" id="showLkErr" style="text-align:left"></div>
  </div>
  <div class="up-wrap">
    <div class="up-row">
      <input type="text" id="lkTitle" placeholder="Tên link...">
      <input type="text" id="lkUrl" placeholder="Link https://...">
      <input type="text" id="lkImg" placeholder="Link ảnh (nếu có sẵn)...">
      <input type="file" id="lkFile" accept="image/*">
      <button class="btn solid" id="lkBtn" onclick="addLink()"><svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Thêm</button>
    </div>
    <div class="err" id="lkErr" style="text-align:left"></div>
  </div>
  <div id="lkList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCvCjTJ30HSsHv-oM1H4nngEHhzMyqjLtw",
  authDomain: "cinevault-ec9d1.firebaseapp.com",
  databaseURL: "https://cinevault-ec9d1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "cinevault-ec9d1",
  storageBucket: "cinevault-ec9d1.firebasestorage.app",
  messagingSenderId: "732539981440",
  appId: "1:732539981440:web:84403c072905d8afcd6065"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.database();

// --- CLOUDINARY (dien thong so cua ban vao) ---
const CLOUD_NAME = "ck9gvbcq";
const UPLOAD_PRESET = "web_upload";
const IC_UP = '<svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
const IC_ADD = '<svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';

let fbUnsub = null, rqUnsub = null, vdUnsub = null, stUnsub = null, lkUnsub = null, slUnsub = null;
let vdCache = {};
const MAX_MB = 100;

function fmtTime(t){
  if(!t) return '';
  const d = new Date(typeof t === 'number' ? t : Date.parse(t));
  if(isNaN(d.getTime())) return '';
  return d.toLocaleString('vi-VN');
}
function esc(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function stars(n){ n=Math.max(0,Math.min(5,n||0)); return '★'.repeat(n)+'☆'.repeat(5-n); }

function renderFb(list){
  document.getElementById('cntFb').textContent = list.length;
  const box = document.getElementById('fbList');
  if(!list.length){ box.innerHTML = '<div class="empty">Chưa có phản hồi nào.</div>'; return; }
  box.innerHTML = list.map(([k,r])=>`
    <div class="item">
      <div class="head">
        <div>
          <span class="who">${esc(r.name)||'Khách ẩn danh'}</span>
          <span class="stars">${stars(r.rating)}</span>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="when">${fmtTime(r.time)}</span>
          <button class="del" onclick="delItem('feedback','${k}')">Xóa</button>
        </div>
      </div>
      <p>${esc(r.content)}</p>
    </div>`).join('');
}

function renderRq(list){
  document.getElementById('cntRq').textContent = list.length;
  const box = document.getElementById('rqList');
  if(!list.length){ box.innerHTML = '<div class="empty">Chưa có yêu cầu nào.</div>'; return; }
  const typeNames = {khung:'Yêu cầu khung mới',sua:'Sửa / xóa khung',download:'Link tải bị lỗi',shop:'Yêu cầu nạp game',khac:'Khác'};
  box.innerHTML = list.map(([k,r])=>`
    <div class="item">
      <div class="head">
        <div>
          <span class="who">${esc(r.name)||'Khách ẩn danh'}</span>
          <span class="tag">${typeNames[r.type]||esc(r.type)||'Khác'}</span>
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <span class="when">${fmtTime(r.time)}</span>
          <button class="del" onclick="delItem('requests','${k}')">Xóa</button>
        </div>
      </div>
      <p>${esc(r.content || r.message)}</p>
    </div>`).join('');
}

function toList(v){ return v ? Object.entries(v).sort((a,b)=>(b[1].time||b[1].ts||0)-(a[1].time||a[1].ts||0)) : []; }

function startListeners(){
  stopListeners();
  fbUnsub = db.ref('feedback').on('value', s => renderFb(toList(s.val())));
  rqUnsub = db.ref('requests').on('value', s => renderRq(toList(s.val())));
  vdUnsub = db.ref('videos').on('value', s => renderVd(toList(s.val())));
  stUnsub = db.ref('settings/showVideos').on('value',
    s => { document.getElementById('showVideos').checked = s.val() !== false; },
    () => { document.getElementById('showVideos').checked = true; });
  lkUnsub = db.ref('links').on('value', s => renderLk(toList(s.val())));
  slUnsub = db.ref('settings/showLinks').on('value',
    s => { document.getElementById('showLinks').checked = s.val() !== false; },
    () => { document.getElementById('showLinks').checked = true; });
}
function stopListeners(){
  if(fbUnsub){ db.ref('feedback').off('value', fbUnsub); fbUnsub=null; }
  if(rqUnsub){ db.ref('requests').off('value', rqUnsub); rqUnsub=null; }
  if(vdUnsub){ db.ref('videos').off('value', vdUnsub); vdUnsub=null; }
  if(stUnsub){ db.ref('settings/showVideos').off('value', stUnsub); stUnsub=null; }
  if(lkUnsub){ db.ref('links').off('value', lkUnsub); lkUnsub=null; }
  if(slUnsub){ db.ref('settings/showLinks').off('value', slUnsub); slUnsub=null; }
}
function delItem(node, key){
  if(!confirm('Xóa mục này vĩnh viễn?')) return;
  db.ref(node+'/'+key).remove()
    .then(()=>console.log('deleted'))
    .catch(e=>alert('Không xóa được: '+e.message));
}

function fmtSize(b){
  if(!b && b!==0) return '';
  const u=['B','KB','MB','GB']; let i=0;
  while(b>=1024 && i<3){ b/=1024; i++; }
  return (b>=10||i===0 ? Math.round(b) : b.toFixed(1))+' '+u[i];
}

function renderVd(list){
  document.getElementById('cntVd').textContent = list.length;
  const box = document.getElementById('vdList');
  if(!list.length){ box.innerHTML = '<div class="empty">Chưa có video nào. Tải lên video đầu tiên nhé!</div>'; return; }
  vdCache = {};
  box.innerHTML = '<div class="vid-grid">' + list.map(function(x){
    const k=x[0], r=x[1]||{};
    vdCache[k] = r.title || '';
    const dl = dlUrl(r.url), poster = posterUrl(r.public_id);
    return '<div class="vid-card">'
      + '<div class="vid-facade" data-url="'+esc(r.url)+'" data-poster="'+esc(poster)+'" onclick="loadVid(this)">'
      + (poster ? '<img class="vid-poster" loading="lazy" src="'+esc(poster)+'" alt="">' : '')
      + '<div class="vid-play"><svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg></div>'
      + '<div class="vid-note">Bấm để phát • '+fmtSize(r.size)+'</div></div>'
      + '<div class="vid-info"><h3>'+esc(r.title)+'</h3>'
      + '<div class="meta"><small>'+fmtTime(r.time)+'</small>'
      + '<a class="vid-dl" href="'+esc(dl)+'" target="_blank" rel="noopener">Tải xuống</a>'
      + '<button class="del" onclick="editVideo(\''+k+'\')">Sửa tên</button>'
      + '<button class="del" onclick="delVideo(\''+k+'\')">Xóa</button>'
      + '</div></div></div>';
  }).join('') + '</div>';
}

const CHUNK_MB = 6;
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function xhrChunk(fd, range, uniqueId, base, total, bar){
  return new Promise(function(res, rej){
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/video/upload');
    xhr.setRequestHeader('X-Unique-Upload-Id', uniqueId);
    xhr.setRequestHeader('Content-Range', range);
    xhr.upload.onprogress = function(e){
      if(e.lengthComputable) bar.style.width = Math.round((base+e.loaded)/total*100)+'%';
    };
    xhr.onload = function(){
      if(xhr.status===200){ try{ res(JSON.parse(xhr.responseText)); }catch(e){ rej(new Error('bad-res')); } }
      else rej(new Error('http-'+xhr.status));
    };
    xhr.onerror = function(){ rej(new Error('net')); };
    xhr.send(fd);
  });
}

function uploadVideo(){
  const fi = document.getElementById('upFile');
  const f = fi.files[0];
  const err = document.getElementById('upErr');
  err.textContent = '';
  if(!f){ err.textContent = 'Hãy chọn 1 file video!'; return; }
  if(f.size > MAX_MB*1024*1024){ err.textContent = 'Video quá lớn! Tối đa '+MAX_MB+'MB (file này '+fmtSize(f.size)+')'; return; }
  if(CLOUD_NAME.indexOf('DANGKY')===0){ err.textContent = 'Chưa cấu hình Cloudinary! Nhờ admin điền Cloud name + Preset.'; return; }
  const title = document.getElementById('upTitle').value.trim() || f.name.replace(/\.[^.]+$/,'');
  const btn = document.getElementById('upBtn');
  btn.disabled = true;
  const prog = document.getElementById('upProg');
  const bar = document.getElementById('upBar');
  prog.style.display = 'block'; bar.style.width = '0';
  const total = f.size, cs = CHUNK_MB*1024*1024;
  const n = Math.max(1, Math.ceil(total/cs));
  const uid = 'web'+Date.now()+Math.floor(Math.random()*1e6);
  (async function(){
    try{
      let r = null;
      for(let i=0;i<n;i++){
        const start = i*cs, end = Math.min(start+cs, total);
        btn.textContent = 'Đang tải '+(i+1)+'/'+n+'...';
        const fd = new FormData();
        fd.append('file', f.slice(start,end));
        fd.append('upload_preset', UPLOAD_PRESET);
        const range = 'bytes '+start+'-'+(end-1)+'/'+total;
        let done = false;
        for(let a=0;a<3 && !done;a++){
          try{ r = await xhrChunk(fd, range, uid, start, total, bar); done = true; }
          catch(e){ if(a===2) throw e; await sleep(1500); }
        }
      }
      await db.ref('videos').push({title:title, url:r.secure_url, public_id:r.public_id||'', size:f.size, time:Date.now()});
      document.getElementById('upTitle').value = '';
      fi.value = '';
      prog.style.display = 'none';
      btn.disabled = false; btn.innerHTML = IC_UP+' Tải lên';
    }catch(e){
      err.textContent = 'Rớt mạng giữa chừng, khúc lỗi đã tự thử lại 3 lần. Mạng ổn thì bấm Tải lên lại nhé!';
      btn.disabled = false; btn.innerHTML = IC_UP+' Tải lên';
    }
  })();
}

function dlUrl(u){
  u = u||'';
  if(u.indexOf('fl_attachment')!==-1) return u;
  return u.replace('/upload/','/upload/fl_attachment/');
}
function posterUrl(pid){
  if(!pid) return '';
  return 'https://res.cloudinary.com/ck9gvbcq/video/upload/so_0,w_640/'+pid+'.jpg';
}
function loadVid(el){
  var url = el.getAttribute('data-url');
  if(!url) return;
  var v = document.createElement('video');
  v.controls = true; v.preload = 'metadata'; v.src = url;
  var poster = el.getAttribute('data-poster');
  if(poster) v.poster = poster;
  v.style.cssText = 'width:100%;display:block;aspect-ratio:16/9;background:#000';
  el.parentNode.replaceChild(v, el);
  var p = v.play(); if(p && p.catch) p.catch(function(){});
}

function delVideo(key){
  if(!confirm('Gỡ video này khỏi web? (file gốc vẫn còn trong kho Cloudinary)')) return;
  db.ref('videos/'+key).remove()
    .catch(function(e){ alert('Không xóa được: '+e.message); });
}

function editVideo(key){
  const cur = (vdCache[key] !== undefined) ? vdCache[key] : '';
  const name = prompt('Tên video mới:', cur);
  if(name === null) return;
  const t = name.trim();
  if(!t){ alert('Tên không được để trống!'); return; }
  if(t === cur) return;
  db.ref('videos/'+key+'/title').set(t)
    .catch(function(e){ alert('Không sửa được: '+e.message); });
}

function toggleShowVideos(on){
  const err = document.getElementById('showErr');
  err.textContent = '';
  db.ref('settings/showVideos').set(!!on).catch(function(e){
    err.textContent = 'Không lưu được ('+e.code+'). Vào Firebase Console → Realtime Database → Rules, thêm "settings": { ".read": true, ".write": "auth != null" } rồi Publish.';
    document.getElementById('showVideos').checked = !on;
  });
}

function toggleShowLinks(on){
  const err = document.getElementById('showLkErr');
  err.textContent = '';
  db.ref('settings/showLinks').set(!!on).catch(function(e){
    err.textContent = 'Không lưu được ('+e.code+'). Kiểm tra Rules đã có "settings" và "links" chưa rồi Publish.';
    document.getElementById('showLinks').checked = !on;
  });
}

function renderLk(list){
  document.getElementById('cntLk').textContent = list.length;
  const box = document.getElementById('lkList');
  if(!list.length){ box.innerHTML = '<div class="empty">Chưa có link nào. Thêm link đầu tiên nhé!</div>'; return; }
  box.innerHTML = list.map(function(x){
    const k=x[0], r=x[1]||{};
    return '<div class="item"><div class="head">'
      + '<div><span class="who">'+esc(r.title)+'</span></div>'
      + '<div style="display:flex;gap:10px;align-items:center">'
      + '<a class="del" style="text-decoration:none" href="'+esc(r.url)+'" target="_blank" rel="noopener">Mở</a>'
      + '<button class="del" onclick="delLink(\''+k+'\')">Xóa</button>'
      + '</div></div></div>';
  }).join('');
}

function delLink(key){
  if(!confirm('Xóa link này khỏi web?')) return;
  db.ref('links/'+key).remove()
    .catch(function(e){ alert('Không xóa được: '+e.message); });
}

const LK_MAX_MB = 10;
function addLink(){
  const title = document.getElementById('lkTitle').value.trim();
  const url = document.getElementById('lkUrl').value.trim();
  const imgUrl = document.getElementById('lkImg').value.trim();
  const fi = document.getElementById('lkFile');
  const f = fi.files[0];
  const err = document.getElementById('lkErr');
  err.textContent = '';
  if(!title){ err.textContent = 'Nhập tên link!'; return; }
  if(!url || !/^https?:\/\//i.test(url)){ err.textContent = 'Link phải bắt đầu bằng http:// hoặc https://'; return; }
  if(!f && !imgUrl){ err.textContent = 'Chọn 1 file ảnh hoặc dán link ảnh!'; return; }
  if(f && f.size > LK_MAX_MB*1024*1024){ err.textContent = 'Ảnh quá lớn! Tối đa '+LK_MAX_MB+'MB'; return; }
  const btn = document.getElementById('lkBtn');
  btn.disabled = true; btn.textContent = 'Đang thêm...';
  function save(img){
    db.ref('links').push({title:title, url:url, img:img, time:Date.now()}).then(function(){
      document.getElementById('lkTitle').value = '';
      document.getElementById('lkUrl').value = '';
      document.getElementById('lkImg').value = '';
      fi.value = '';
      btn.disabled = false; btn.innerHTML = IC_ADD+' Thêm';
    }).catch(function(e){
      err.textContent = 'Không lưu được ('+e.code+'). Kiểm tra Rules đã có "links" chưa rồi Publish.';
      btn.disabled = false; btn.innerHTML = IC_ADD+' Thêm';
    });
  }
  if(!f){ save(imgUrl); return; }
  const fd = new FormData();
  fd.append('file', f);
  fd.append('upload_preset', UPLOAD_PRESET);
  fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/image/upload', {method:'POST', body:fd})
    .then(function(r){ if(!r.ok) throw new Error('http-'+r.status); return r.json(); })
    .then(function(r){ save(r.secure_url); })
    .catch(function(){ err.textContent = 'Tải ảnh thất bại! Kiểm tra Cloud name + Preset.'; btn.disabled=false; btn.innerHTML=IC_ADD+' Thêm'; });
}

function showLogin(){ document.getElementById('loginView').style.display='block'; document.getElementById('adminView').style.display='none'; stopListeners(); }
function showAdmin(){ document.getElementById('loginView').style.display='none'; document.getElementById('adminView').style.display='block'; startListeners(); }

function doLogin(e){
  e.preventDefault();
  const err = document.getElementById('lgErr');
  err.textContent='';
  auth.signInWithEmailAndPassword(document.getElementById('lgEmail').value.trim(), document.getElementById('lgPass').value)
    .catch(ex => { err.textContent = 'Sai email hoặc mật khẩu! ('+ex.code+')'; });
}
function doLogout(){ auth.signOut(); }

auth.onAuthStateChanged(u => { u ? showAdmin() : showLogin(); });
</script>
