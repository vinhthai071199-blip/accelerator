<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Quản trị — AcceleratorAres</title>
<link rel="icon" type="image/jpeg" href="avatar.jpg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#000;color:#fff;min-height:100vh;padding:24px 5% 60px}
a{color:inherit}
.login-wrap{max-width:380px;margin:12vh auto 0;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:34px 28px}
.login-wrap h1{font-size:20px;margin-bottom:22px;text-align:center;letter-spacing:1px}
.login-wrap h1 em{color:#ffffff;font-style:normal}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#c9c9d1;margin:14px 0 7px}
input{width:100%;padding:13px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#fff;font-size:14px;outline:none}
input:focus{border-color:rgba(255,255,255,.55)}
select{width:100%;padding:13px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.14);background:#10131a;color:#fff;font-size:14px;outline:none}
.up-row select{flex:1;min-width:180px;width:auto}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:6px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.solid{background:#e9e9f0;color:#0d0a14;border:none}
.btn.solid:hover{box-shadow:0 6px 18px rgba(0,0,0,.5)}
.ic{width:1.05em;height:1.05em;vertical-align:-0.16em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.full{width:100%;justify-content:center;margin-top:20px}
.err{color:#f87171;font-size:13px;margin-top:14px;text-align:center;min-height:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .brand{font-size:17px;font-weight:700;letter-spacing:.5px}
.topbar .brand em{color:#ffffff;font-style:normal}
.topbar .actions{display:flex;gap:10px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.stat{flex:1;min-width:140px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:16px 18px}
.stat b{display:block;font-size:26px;color:#ffffff}
.stat span{font-size:12.5px;color:#c9c9d1;letter-spacing:.5px}
h2.sec{font-size:17px;margin:30px 0 14px;display:flex;align-items:center;gap:9px}
.item{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:15px 18px;margin-bottom:11px}
.item .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.item .who{font-weight:600;font-size:14.5px}
.item p{margin-top:8px;font-size:13.5px;line-height:1.65;color:#e6e6ea;word-break:break-word}
.item .tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:3px;background:rgba(255,255,255,.14);color:#ffffff;margin-left:8px;vertical-align:middle}
.del{padding:6px 13px;border-radius:5px;border:1px solid rgba(248,113,113,.35);background:transparent;color:#f87171;font-size:12.5px;cursor:pointer}
.del:hover{background:rgba(248,113,113,.12)}
.empty{color:#8a8a93;font-size:13.5px;padding:22px 0;text-align:center}
.up-wrap{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:20px;margin-bottom:16px}
.up-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.up-row input[type=text]{flex:1;min-width:180px}
.up-row input[type=file]{padding:10px;font-size:12.5px}
.prog{height:8px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:12px;overflow:hidden;display:none}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffffff,#8e8e96)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#8fd694}
.live i{width:8px;height:8px;border-radius:50%;background:#4caf6d;display:inline-block}
/* ===== THE VIDEO GIONG TRANG CHINH ===== */
.vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.vid-card{border-radius:12px;overflow:hidden;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.09)}
.vid-facade{aspect-ratio:16/9;background:#000;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
.vid-facade::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45)}
.vid-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid-play{width:56px;height:56px;border-radius:50%;background:rgba(10,12,16,.45);border:none;color:#ffffff;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.vid-play svg{width:22px;height:22px;fill:currentColor;margin-left:3px}
.vid-note{color:#c9c9d1;font-size:12px;position:relative;z-index:1}
.vid-card video{width:100%;display:block;aspect-ratio:16/9;background:#000}
.vid-info{padding:14px 16px 18px}
.vid-info h3{font-size:14.5px;font-weight:600;margin-bottom:10px;line-height:1.4;word-break:break-word}
.vid-info .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vid-info .meta small{color:#a9a9b2;font-size:12px}
.vid-dl{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border-radius:999px;background:#e9e9f0;color:#0d0a14;font-size:12px;font-weight:700;text-decoration:none}
@media(max-width:600px){.login-wrap{margin-top:8vh}.topbar{flex-direction:column;align-items:flex-start}}
</style>
</head>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCvCjTJ30HSsHv-oM1H4nngEHhzMyqjLtw",
  authDomain: "cinevault-ec9d1.firebaseapp.com",
  databaseURL: "https://cinevault-ec9d1-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "cinevault-ec9d1",
  storageBucket: "cinevault-ec9d1.firebasestorage.app",
  messagingSenderId: "732539981440",
  appId: "1:732539981440:web:84403c072905d8afcd6065"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.database();

// --- CLOUDINARY (dien thong so cua ban vao) ---
const CLOUD_NAME = "ck9gvbcq";
const UPLOAD_PRESET = "web_upload";
const IC_UP = '<svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
const IC_ADD = '<svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';

let vdUnsub = null, stUnsub = null, lkUnsub = null, slUnsub = null, phUnsub = null, spUnsub = null, ytQUnsub = null;
let vdLast = [], lkLast = [], phLast = [], ytQLast = [];
let vdCache = {};
let lkCache = {};
let phCache = {};
let catCache = {videos:{}, links:{}, photos:{}};
let catUnsub = {};

function catNameOf(r){ return (typeof r==='string') ? (r||'') : ((r&&r.name)||''); }
function fillCatSels(sec, v){
  catCache[sec] = v || {};
  const names = Object.values(catCache[sec]).map(catNameOf).filter(function(n){ return n; }).sort();
  document.querySelectorAll('select[data-sec="'+sec+'"]').forEach(function(sel){
    const cur = sel.value;
    const pick = sel.getAttribute('data-pick');
    sel.innerHTML = '<option value="">— Không nhóm —</option>' + names.map(function(n){ return '<option value="'+esc(n)+'">'+esc(n)+'</option>'; }).join('');
    let want = '';
    if(pick && names.indexOf(pick)!==-1){ want = pick; sel.removeAttribute('data-pick'); }
    else if(names.indexOf(cur)!==-1){ want = cur; }
    sel.value = want;
  });
}
function findCatId(sec, name){
  const all = catCache[sec] || {};
  for(const id of Object.keys(all)){ if(catNameOf(all[id])===name) return id; }
  return null;
}
function addCat(sec, selId){
  const name = (prompt('Tên nhóm mới:','')||'').trim();
  if(!name) return;
  if(findCatId(sec, name)){ alert('Nhóm này đã có!'); return; }
  document.getElementById(selId).setAttribute('data-pick', name);
  db.ref('cats/'+sec).push({name:name})
    .catch(function(e){ alert('Không tạo được: '+e.message); });
}
function renameCat(sec, selId, node){
  const old = document.getElementById(selId).value;
  if(!old){ alert('Chọn nhóm cần đổi tên!'); return; }
  const name = (prompt('Tên mới cho "'+old+'":', old)||'').trim();
  if(!name || name===old) return;
  if(findCatId(sec, name)){ alert('Tên này đã có!'); return; }
  const id = findCatId(sec, old);
  if(!id){ alert('Không tìm thấy nhóm!'); return; }
  document.getElementById(selId).setAttribute('data-pick', name);
  db.ref('cats/'+sec+'/'+id).set({name:name}).then(function(){
    return db.ref(node).once('value');
  }).then(function(s){
    const up = {};
    Object.entries(s.val()||{}).forEach(function([k,r]){ if(((r||{}).cat||'')===old) up[k+'/cat'] = name; });
    if(Object.keys(up).length) return db.ref(node).update(up);
  }).catch(function(e){ alert('Không đổi được: '+e.message); });
}
function delCat(sec, selId, node){
  const old = document.getElementById(selId).value;
  if(!old){ alert('Chọn nhóm cần xóa!'); return; }
  if(!confirm('Xóa nhóm "'+old+'"? Các mục trong nhóm sẽ về Không nhóm.')) return;
  const id = findCatId(sec, old);
  const go = function(){
    return db.ref(node).once('value').then(function(s){
      const up = {};
      Object.entries(s.val()||{}).forEach(function([k,r]){ if(((r||{}).cat||'')===old) up[k+'/cat'] = ''; });
      const p = Object.keys(up).length ? db.ref(node).update(up) : Promise.resolve();
      return p.then(function(){ document.getElementById(selId).value = ''; });
    });
  };
  if(id){ db.ref('cats/'+sec+'/'+id).remove().then(go).catch(function(e){ alert('Không xóa được: '+e.message); }); }
  else go().catch(function(e){ alert('Không xóa được: '+e.message); });
}
const MAX_MB = 200;
const CL_MAX = 100*1024*1024;

function fmtTime(t){
  if(!t) return '';
  const d = new Date(typeof t === 'number' ? t : Date.parse(t));
  if(isNaN(d.getTime())) return '';
  return d.toLocaleString('vi-VN');
}

function fmtSize(b){
  if(!b && b!==0) return '';
  const u=['B','KB','MB','GB']; let i=0;
  while(b>=1024 && i<3){ b/=1024; i++; }
  return (b>=10||i===0 ? Math.round(b) : b.toFixed(1))+' '+u[i];
}

function uploadVideo(){
  const fi = document.getElementById('upFile');
  const f = fi.files[0];
  const err = document.getElementById('upErr');
  err.textContent = '';
  if(!f){ return; }
  fi.value = '';
  if(f.size > MAX_MB*1024*1024){ err.textContent = 'Video quá lớn! Tối đa '+MAX_MB+'MB (file này '+fmtSize(f.size)+')'; return; }
  if(CLOUD_NAME.indexOf('DANGKY')===0){ err.textContent = 'Chưa cấu hình Cloudinary! Nhờ admin điền Cloud name + Preset.'; return; }
  const title = document.getElementById('upTitle').value.trim() || f.name.replace(/\.[^.]+$/,'');
  const btn = document.getElementById('upBtn');
  btn.disabled = true;
  const prog = document.getElementById('upProg');
  const bar = document.getElementById('upBar');
  prog.style.display = 'block'; bar.style.width = '0';
  const host = document.getElementById('upHost').value;
  if(host === 'mediafire'){
    err.textContent = '';
    prog.style.display = 'none'; btn.disabled = false; btn.innerHTML = IC_UP+' Tải lên';
    alert('Up file trên mediafire.com rồi lấy link dán vào mục Links (nút Thêm) nhé! Mục Video chỉ nhận Cloudinary/Catbox.');
    return;
  }
  if(host === 'cloudinary' && f.size > CL_MAX){
    err.textContent = 'Cloudinary free chỉ nhận tối đa 100MB! Chọn Catbox hoặc nén video lại.';
    prog.style.display = 'none'; btn.disabled = false; btn.innerHTML = IC_UP+' Tải lên'; return;
  }
  if(host === 'catbox' || f.size > CL_MAX){ btn.textContent = 'Đang tải lên Catbox...'; upCatbox(f,title,btn,prog,bar,err); return; }
  let tries = 0;
  (function upOne(){
    tries++;
    btn.textContent = 'Đang tải lên Cloudinary' + (tries>1 ? ' (lần '+tries+')' : '') + '...';
    const fd = new FormData();
    fd.append('file', f);
    fd.append('upload_preset', UPLOAD_PRESET);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/video/upload');
    xhr.upload.onprogress = function(e){
      if(e.lengthComputable) bar.style.width = Math.round(e.loaded/e.total*100)+'%';
    };
    xhr.onload = function(){
      if(xhr.status===200){
        let r = {};
        try{ r = JSON.parse(xhr.responseText); }catch(e){}
        if(!r.secure_url && tries<3){ setTimeout(function(){ upOne(); },1500); return; }
        db.ref('videos').push({title:title, url:r.secure_url, public_id:r.public_id||'', del:r.delete_token||'', cat:document.getElementById('vidCatSel').value, size:f.size, time:Date.now()}).then(function(){
          document.getElementById('upTitle').value = '';
          prog.style.display = 'none';
          btn.disabled = false; btn.innerHTML = IC_UP+' Tải lên';
        });
      } else if(tries<3){ setTimeout(function(){ upOne(); },1500); }
      else {
        let msg = 'mã '+xhr.status;
        try{ const b = JSON.parse(xhr.responseText); if(b && b.error && b.error.message) msg = b.error.message; }catch(e){}
        err.textContent = 'Tải thất bại ('+msg+')!';
        btn.disabled = false; btn.innerHTML = IC_UP+' Tải lên';
      }
    };
    xhr.onerror = function(){
      if(tries<3){ setTimeout(function(){ upOne(); },1500); }
      else { err.textContent = 'Rớt mạng 3 lần liên tiếp! Bấm Tải lên thử lại nhé.'; btn.disabled=false; btn.innerHTML=IC_UP+' Tải lên'; }
    };
    xhr.send(fd);
  })();
}

/* ============ YOUTUBE: DAN LINK -> XEM TRUOC / TAI FILE / LUU LINK ============
   Luong lay tin: Invidious (co ten + tac gia + do dai + file tron
   hinh+tieng) -> rot xuong noembed (chi ten + tac gia + thumbnail).
   Nut Tai/Up phu thuoc cau noi ben thu ba, luc mo luc dong: duoc thi
   tai ngay, khong thi bao ro chu khong treo. */
const YT_BRIDGE = 'https://invidious.f5.si';
let ytInfo = null;
function ytId(u){
  u = (u||'').trim();
  let m = u.match(/[?&]v=([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  m = u.match(/youtu\.be\/([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  m = u.match(/youtube\.com\/(shorts|embed|live)\/([A-Za-z0-9_-]{11})/);
  if(m) return m[2];
  if(/^[A-Za-z0-9_-]{11}$/.test(u)) return u;
  return '';
}
function ytDur(s){
  s = Math.floor(+s||0);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), r = s%60;
  return (h?h+':':'')+(h?(m<10?'0':''):'')+m+':'+(r<10?'0':'')+r;
}
async function ytFetch(){
  const err = document.getElementById('ytErr');
  const prev = document.getElementById('ytPrev');
  const btn = document.getElementById('ytBtn');
  err.textContent = '';
  ytInfo = null;
  const id = ytId(document.getElementById('ytUrl').value);
  if(!id){ err.textContent = 'Link YouTube không hợp lệ! Dán link watch / youtu.be / shorts.'; return; }
  const watch = 'https://www.youtube.com/watch?v='+id;
  btn.disabled = true; btn.textContent = 'Đang lấy...';
  prev.innerHTML = '<div class="empty">Đang lấy thông tin...</div>';
  ytInfo = null;
  /* noembed truoc (nhanh, ~1s) -> hien ngay; Invidious sau (lay them do dai), timeout 10s */
  try{
    const n = await (await fetch('https://noembed.com/embed?url='+encodeURIComponent(watch))).json();
    if(n && n.title){
      ytInfo = {id:id, title:n.title, author:n.author_name||'', dur:0, thumb:n.thumbnail_url||('https://i.ytimg.com/vi/'+id+'/hqdefault.jpg')};
      btn.disabled = false; btn.textContent = 'Lấy thông tin';
      ytRender();
    }
  }catch(e){}
  try{
    const ctl = new AbortController();
    const to = setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, 10000);
    const r = await (await fetch(YT_BRIDGE+'/api/v1/videos/'+id+'?hl=vi', {signal:ctl.signal})).json();
    clearTimeout(to);
    if(r && r.title){
      const th = (r.videoThumbnails||[]).find(function(t){ return t.quality==='sddefault'; })||{};
      if(ytInfo){
        ytInfo.dur = r.lengthSeconds || ytInfo.dur;
        if(th.url) ytInfo.thumb = th.url;
      } else {
        ytInfo = {id:id, title:r.title||id, author:r.author||'', dur:r.lengthSeconds||0, thumb:th.url||('https://i.ytimg.com/vi/'+id+'/hqdefault.jpg')};
      }
      btn.disabled = false; btn.textContent = 'Lấy thông tin';
      ytRender();
    }
  }catch(e){}
  btn.disabled = false; btn.textContent = 'Lấy thông tin';
  if(!ytInfo){
    err.textContent = 'Không lấy được thông tin. Kiểm tra lại link hoặc mạng rồi thử lại.';
    prev.innerHTML = '';
  }
}
function ytRender(){
  const prev = document.getElementById('ytPrev');
  if(!ytInfo){ prev.innerHTML = ''; return; }
  let h = '<div class="item"><div class="head"><div><span class="who">'+esc(ytInfo.title)+'</span>'
    + (ytInfo.author?'<span class="tag">'+esc(ytInfo.author)+'</span>':'')
    + (ytInfo.dur?'<span class="tag">'+esc(ytDur(ytInfo.dur))+'</span>':'')
    + '</div><div style="display:flex;gap:10px;align-items:center">'
    + '<button class="del" id="ytSrvBtn" onclick="ytQueue()">Gửi máy nhà tải</button>'
    + '</div></div>'
    + '<p><img loading="lazy" src="'+esc(ytInfo.thumb)+'" alt="" style="width:100%;max-width:420px;display:block;aspect-ratio:16/9;object-fit:cover;background:#000;border-radius:6px"></p>';
  h += '<p id="ytSrvNote" style="color:#a9a9b2;font-size:12.5px"></p></div>';
  prev.innerHTML = h;
  ytPing();
}

/* ============ YOUTUBE QUA MAY NHA (yt-server) ============
   Admin goi http://127.0.0.1:8799 tren chinh may cua ban: tai bang
   yt-dlp + ffmpeg, up Cloudinary, tra link ve de admin tu ghi Firebase.
   May nha tat thi nut tu an (ytPing), khong bao gio treo. */
const YT_SRV = 'http://127.0.0.1:8799';
let ytSrvOn = false;
let ytBaseCur = YT_SRV;
async function ytPing(){
  let base = YT_SRV;
  try{
    const s = await db.ref('settings/ytServerBase').once('value');
    if(s.val()) base = String(s.val()).replace(/\/+$/,'');
  }catch(e){}
  ytBaseCur = base;
  ytBaseLast = (base === YT_SRV ? '' : base);
  const bi = document.getElementById('ytBase');
  if(bi && document.activeElement !== bi) bi.value = (base === YT_SRV ? '' : base);
  try{
    const r = await fetch(base+'/ping');
    ytSrvOn = !!(r.ok && (await r.json()).ok);
  }catch(e){ ytSrvOn = false; }
  const n = document.getElementById('ytSrvNote');
  if(n) n.textContent = ytSrvOn ? 'Máy chủ đang bật — gửi là tải ngay.'
    : 'Máy chủ đang tắt — cứ gửi, máy bật sẽ tự tải.';
}
let ytBaseTimer = null;
let ytBaseLast = null;
async function ytBaseLoad(){
  try{
    const s = await db.ref('settings/ytServerBase').once('value');
    const v = s.val() ? String(s.val()).replace(/\/+$/,'') : '';
    ytBaseLast = v;
    const bi = document.getElementById('ytBase');
    if(bi && document.activeElement !== bi) bi.value = v;

async function ytBaseAuto(){
  const inp = document.getElementById('ytBase');
  const st = document.getElementById('ytBaseSt');
  const v = (inp.value || '').trim().replace(/\/+$/,'');
  if(v && !/^https?:\/\//i.test(v)){ if(st) st.textContent = 'Địa chỉ phải bắt đầu bằng http:// hoặc https:// — chưa lưu.'; return; }
  if(v === ytBaseLast) return;
  clearTimeout(ytBaseTimer);
  ytBaseTimer = setTimeout(async function(){
    try{
      await db.ref('settings/ytServerBase').set(v);
      ytBaseLast = v;
      if(st) st.textContent = v ? ('Đã tự lưu lúc ' + new Date().toLocaleTimeString('vi-VN')) : 'Đã xóa địa chỉ máy chủ chung.';
      ytPing();
    }catch(e){
      if(st) st.textContent = 'Không lưu được (' + (e.code || '') + '). Kiểm tra Rules rồi Publish.';
    }
  }, 1200);
}
function ytBaseDel(){
  const inp = document.getElementById('ytBase');
  if(!inp.value && !ytBaseLast) return;
  if(!confirm('Xóa địa chỉ máy chủ chung? Mọi admin sẽ về dùng máy của mình (localhost).')) return;
  inp.value = '';
  ytBaseAuto();
}

function dlUrl(u){
  u = u||'';
  if(u.indexOf('fl_attachment')!==-1) return u;
  return u.replace('/upload/','/upload/fl_attachment/');
}
function posterUrl(r){
  if(!r) return '';
  if(r.poster) return r.poster;
  if(!r.public_id) return '';
  return 'https://res.cloudinary.com/'+CLOUD_NAME+'/video/upload/so_0,w_640/'+r.public_id+'.jpg';
}
/* Tai file khong phai Cloudinary (Catbox / o cung): fetch ve blob roi
   save (trinh duyet tu mo hop luu). Loi (may nha tat, CORS) -> mo tab moi. */
async function dlFile(el){
  const url = el.getAttribute('data-url'), name = el.getAttribute('data-name') || 'video.mp4';
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('bad');
    const b = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); if(a.parentNode) a.parentNode.removeChild(a); }, 5000);
  }catch(e){ window.open(url, '_blank', 'noopener'); }
  return false;
}
function loadVid(el){
  var url = el.getAttribute('data-url');
  if(!url) return;
  var v = document.createElement('video');
  v.controls = true; v.preload = 'metadata'; v.src = url;
  var poster = el.getAttribute('data-poster');
  if(poster) v.poster = poster;
  v.style.cssText = 'width:100%;display:block;aspect-ratio:16/9;background:#000';
  el.parentNode.replaceChild(v, el);
  var p = v.play(); if(p && p.catch) p.catch(function(){});
}

function cloudDelete(token){
  if(!token) return Promise.resolve();
  const fd = new FormData();
  fd.append('token', token);
  return fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/delete_by_token', {method:'POST', body:fd}).catch(function(){}).then(function(){});
}

function editVideo(key){
  const cur = (vdCache[key] && vdCache[key].title) || '';
  const name = prompt('Tên video mới:', cur);
  if(name === null) return;
  const t = name.trim();
  if(!t){ alert('Tên không được để trống!'); return; }
  if(t === cur) return;
  db.ref('videos/'+key+'/title').set(t)
    .catch(function(e){ alert('Không sửa được: '+e.message); });
}

function toggleHide(node, key, cur){
  db.ref(node+'/'+key+'/hidden').set(!cur)
    .catch(function(e){ alert('Không lưu được: '+e.message); });
}

function toggleShowVideos(on){

function toggleShowLinks(on){

function renderLk(list){
  list = list || lkLast || [];
  document.getElementById('cntLk').textContent = list.length;
  const hidN = list.filter(function(x){ return !!((x[1]||{}).hidden); }).length;

  const view = showH ? list : list.filter(function(x){ return !((x[1]||{}).hidden); });
  const box = document.getElementById('lkList');
  if(!view.length){ box.innerHTML = '<div class="empty">'+(list.length ? 'Tất cả đang ẩn. Tick "Hiện các mục ĐÃ ẨN" để xem.' : 'Chưa có link nào. Thêm link đầu tiên nhé!')+'</div>'; return; }
  box.innerHTML = view.map(function(x){
    const k=x[0], r=x[1]||{};
    lkCache[k] = r.title || '';
    return '<div class="item"'+(r.hidden?' style="opacity:.55"':'')+'><div class="head">'
      + '<div><span class="who">'+esc(r.title)+'</span>'
      + (r.cat?'<span class="tag">'+esc(r.cat)+'</span>':'')
      + (r.hidden?'<span class="tag">ĐÃ ẨN</span>':'')
      + '</div>'
      + '<div style="display:flex;gap:10px;align-items:center">'
      + '<a class="del" style="text-decoration:none" href="'+esc(r.url)+'" target="_blank" rel="noopener">Mở</a>'
      + '<button class="del" onclick="editLink(\''+k+'\')">Sửa tên</button>'
      + '<button class="del" onclick="toggleHide(\'links\',\''+k+'\','+(r.hidden?'true':'false')+')">'+(r.hidden?'Hiện':'Ẩn')+'</button>'
      + '<button class="del" onclick="delLink(\''+k+'\')">Xóa</button>'
      + '</div></div></div>';
  }).join('');
}

function editLink(key){
  const cur = lkCache[key] || '';
  const name = prompt('Tên link mới:', cur);
  if(name === null) return;
  const t = name.trim();
  if(!t){ alert('Tên không được để trống!'); return; }
  if(t === cur) return;
  db.ref('links/'+key+'/title').set(t)
    .catch(function(e){ alert('Không sửa được: '+e.message); });
}

function delLink(key){
  if(!confirm('Xóa link này khỏi web?')) return;
  db.ref('links/'+key).remove()
    .catch(function(e){ alert('Không xóa được: '+e.message); });
}

function addLink(){
  const title = document.getElementById('lkTitle').value.trim();
  const url = document.getElementById('lkUrl').value.trim();
  const fi = document.getElementById('lkFile');
  const f = fi.files[0];
  const host = document.getElementById('lkHost').value;
  const err = document.getElementById('lkErr');
  err.textContent = '';
  if(!title){ err.textContent = 'Nhập tên link!'; return; }
  const btn = document.getElementById('lkBtn');
  if(!f && !url){
    if(!url){ fi.click(); return; }
  }
  fi.value = '';
  if(!f){
    if(!url || !/^https?:\/\//i.test(url)){ err.textContent = 'Link phải bắt đầu bằng http:// hoặc https://'; return; }
    return saveLink(url);
  }
  if(host === 'mediafire'){
    alert('Up file trên mediafire.com rồi lấy link dán vào ô Link nhé! Mục này chỉ nhận link.');
    fi.click(); return;
  }
  const isImg = f.type.indexOf('image/') === 0;
  const isVid = f.type.indexOf('video/') === 0;
  if(host === 'cloudinary' || (host === 'auto' && ((isImg && f.size <= 10*1024*1024) || (isVid && f.size <= CL_MAX)))){
    if(!isImg && !isVid){ err.textContent = 'Cloudinary chỉ nhận ảnh/video! File này chọn Catbox hoặc MediaFire.'; return; }
    if(isImg && f.size > 10*1024*1024){ err.textContent = 'Ảnh quá 10MB! Chọn Catbox hoặc MediaFire.'; return; }
    if(isVid && f.size > CL_MAX){ err.textContent = 'Video quá 100MB! Chọn Catbox hoặc MediaFire.'; return; }
    return upLinkFile(f, isImg ? 'image' : 'video');
  }
  err.textContent = 'File này (' + fmtSize(f.size) + ') trình duyệt không tự up được. Gửi đường dẫn file cho admin up hộ, hoặc up tay lên MediaFire rồi dán link!';
  function saveLink(u){
    btn.disabled = true; btn.textContent = 'Đang thêm...';
    db.ref('links').push({title:title, url:u, cat:document.getElementById('lkCatSel').value, time:Date.now()}).then(function(){
      document.getElementById('lkTitle').value = '';
      document.getElementById('lkUrl').value = '';
      btn.disabled = false; btn.innerHTML = IC_ADD+' Thêm';
    }).catch(function(e){
      err.textContent = 'Không lưu được ('+e.code+'). Kiểm tra Rules rồi Publish.';
      btn.disabled = false; btn.innerHTML = IC_ADD+' Thêm';
    });
  }
  function upLinkFile(file, kind){
    btn.disabled = true; btn.textContent = 'Đang tải...';
    const fd = new FormData();
    fd.append('file', file);
    fd.append('upload_preset', UPLOAD_PRESET);
    fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/'+kind+'/upload', {method:'POST', body:fd})
      .then(function(r){ if(!r.ok) throw new Error('http-'+r.status); return r.json(); })
      .then(function(r){
        document.getElementById('lkTitle').value = '';
        document.getElementById('lkUrl').value = '';
        btn.disabled = false; btn.innerHTML = IC_ADD+' Thêm';
        db.ref('links').push({title:title, url:r.secure_url, cat:document.getElementById('lkCatSel').value, time:Date.now()});
      })
      .catch(function(){ err.textContent = 'Tải file thất bại!'; btn.disabled=false; btn.innerHTML=IC_ADD+' Thêm'; });
  }
}

const PH_MAX_MB = 10;
function renderPh(list){
  list = list || phLast || [];
  document.getElementById('cntPh').textContent = list.length;
  const hidN = list.filter(function(x){ return !!((x[1]||{}).hidden); }).length;
  const hc = document.getElementById('phHiddenCnt');
  if(hc) hc.textContent = hidN ? '('+hidN+' đang ẩn)' : '';
  const showH = (document.getElementById('prevHiddenPh')||{}).checked !== false;
  const view = showH ? list : list.filter(function(x){ return !((x[1]||{}).hidden); });
  const box = document.getElementById('phList');
  if(!view.length){ box.innerHTML = '<div class="empty">'+(list.length ? 'Tất cả đang ẩn. Tick "Hiện các mục ĐÃ ẨN" để xem.' : 'Chưa có ảnh nào. Thêm ảnh đầu tiên nhé!')+'</div>'; return; }
  box.innerHTML = '<div class="vid-grid">' + view.map(function(x){
    const k=x[0], r=x[1]||{};
    phCache[k] = {title: r.title||'', del: r.del||''};
    const hdP = !!r.hidden;
    return '<div class="vid-card"'+(hdP?' style="opacity:.55"':'')+'>'
      + '<a href="'+esc(r.img)+'" target="_blank" rel="noopener"><img loading="lazy" src="'+esc(r.img)+'" alt="" style="width:100%;display:block;aspect-ratio:16/10;object-fit:cover;background:#000"></a>'
      + '<div class="vid-info">'
      + (r.cat?'<span class="tag">'+esc(r.cat)+'</span> ':'')
      + (hdP?'<span class="tag">ĐÃ ẨN</span> ':'')
      + '<h3>'+esc(r.title)+'</h3>'
      + '<div class="meta"><small>'+fmtTime(r.time)+'</small>'
      + '<button class="del" onclick="editPhoto(\''+k+'\')">Sửa tên</button>'
      + '<button class="del" onclick="toggleHide(\'photos\',\''+k+'\','+(hdP?'true':'false')+')">'+(hdP?'Hiện':'Ẩn')+'</button>'
      + '<button class="del" onclick="delPhoto(\''+k+'\')">Xóa</button>'
      + '</div></div></div>';
  }).join('') + '</div>';
}

function delPhoto(key){
  if(!confirm('Xóa ảnh này khỏi web VÀ khỏi kho Cloudinary?')) return;
  const rec = phCache[key] || {};
  cloudDelete(rec.del || '').then(function(){
    db.ref('photos/'+key).remove()
      .catch(function(e){ alert('Không xóa được: '+e.message); });
  });
}

function editPhoto(key){
  const cur = (phCache[key] && phCache[key].title) || '';
  const name = prompt('Tên ảnh mới:', cur);
  if(name === null) return;
  const t = name.trim();
  if(!t){ alert('Tên không được để trống!'); return; }
  if(t === cur) return;
  db.ref('photos/'+key+'/title').set(t)
    .catch(function(e){ alert('Không sửa được: '+e.message); });
}

function toggleShowPhotos(on){
  const err = document.getElementById('showPhErr');
  err.textContent = '';
  db.ref('settings/showPhotos').set(!!on).catch(function(e){
    err.textContent = 'Không lưu được ('+e.code+'). Kiểm tra Rules đã có "settings" và "photos" chưa rồi Publish.';
    document.getElementById('showPhotos').checked = !on;
  });
}

function addPhoto(){
  const title = document.getElementById('phTitle').value.trim();
  const imgUrl = document.getElementById('phImg').value.trim();
  const fi = document.getElementById('phFile');
  const f = fi.files[0];
  const err = document.getElementById('phErr');
  err.textContent = '';
  if(!title){ err.textContent = 'Nhập tên ảnh!'; return; }
  if(!f && !imgUrl){ fi.click(); return; }
  fi.value = '';
  if(f && f.size > PH_MAX_MB*1024*1024){ err.textContent = 'Ảnh quá lớn! Tối đa '+PH_MAX_MB+'MB'; return; }
  const btn = document.getElementById('phBtn');
  btn.disabled = true; btn.textContent = 'Đang thêm...';
  function save(img, del){
    db.ref('photos').push({title:title, img:img, del:del||'', cat:document.getElementById('phCatSel').value, time:Date.now()}).then(function(){
      document.getElementById('phTitle').value = '';
      document.getElementById('phImg').value = '';
      fi.value = '';
      btn.disabled = false; btn.innerHTML = IC_ADD+' Thêm';
    }).catch(function(e){
      err.textContent = 'Không lưu được ('+e.code+'). Kiểm tra Rules đã có "photos" chưa rồi Publish.';
      btn.disabled = false; btn.innerHTML = IC_ADD+' Thêm';
    });
  }
  if(!f){ save(imgUrl,''); return; }
  const fd = new FormData();
  fd.append('file', f);
  fd.append('upload_preset', UPLOAD_PRESET);
  fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/image/upload', {method:'POST', body:fd})
    .then(function(r){ if(!r.ok) throw new Error('http-'+r.status); return r.json(); })
    .then(function(r){ save(r.secure_url, (r.delete_token||'')); })
    .catch(function(){ err.textContent = 'Tải ảnh thất bại! Kiểm tra Cloud name + Preset.'; btn.disabled=false; btn.innerHTML=IC_ADD+' Thêm'; });
}

function showLogin(){ document.getElementById('loginView').style.display='block'; document.getElementById('adminView').style.display='none'; stopListeners(); }
function showAdmin(){ document.getElementById('loginView').style.display='none'; document.getElementById('adminView').style.display='block'; startListeners(); ytBaseLoad(); }

function doLogin(e){
  e.preventDefault();
  const err = document.getElementById('lgErr');
  err.textContent='';
  auth.signInWithEmailAndPassword(document.getElementById('lgEmail').value.trim(), document.getElementById('lgPass').value)
    .catch(ex => { err.textContent = 'Sai email hoặc mật khẩu! ('+ex.code+')'; });
}
function doLogout(){ auth.signOut(); }

function changePass(){
  const user = auth.currentUser;
  if(!user){ alert('Bạn chưa đăng nhập!'); return; }
  const cur = prompt('Nhập mật khẩu hiện tại:');
  if(!cur) return;
  const nw = prompt('Mật khẩu mới (tối thiểu 6 ký tự):');
  if(!nw) return;
  if(nw.length < 6){ alert('Mật khẩu mới phải từ 6 ký tự!'); return; }
  const cf = prompt('Nhập lại mật khẩu mới:');
  if(cf !== nw){ alert('Hai mật khẩu mới không khớp!'); return; }
  const cred = firebase.auth.EmailAuthProvider.credential(user.email, cur);
  user.reauthenticateWithCredential(cred).then(function(){
    return user.updatePassword(nw);
  }).then(function(){
    alert('Đổi mật khẩu xong! Lần sau đăng nhập bằng pass mới.');
  }).catch(function(e){
    alert('Không đổi được (' + (e.code || '') + '): ' + (e.message || 'sai mật khẩu hiện tại?'));
  });
}

auth.onAuthStateChanged(u => { u ? showAdmin() : showLogin(); });
