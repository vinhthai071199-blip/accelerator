<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js Demo — AcceleratorAres</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0c10;color:#e8e4da;font-family:'Poppins',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top{padding:22px 5%;width:100%;max-width:900px;display:flex;align-items:center;gap:14px}
.top a{color:#d4b87a;text-decoration:none;font-size:13px;border:1px solid rgba(200,168,100,.45);border-radius:999px;padding:9px 18px}
.top b{font-size:15px;letter-spacing:1px}.top b em{color:#c8a864;font-style:normal}
#box{width:min(900px,94vw);height:60vh;min-height:380px;border:1px solid rgba(200,168,100,.3);border-radius:14px;overflow:hidden;background:#0a0c10}
canvas{display:block;width:100%;height:100%}
.hint{color:#9a9388;font-size:12.5px;margin:14px 0 30px;letter-spacing:.5px}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"}}
</script>
</head>
<body>
<div class="top"><a href="/">← Về trang chủ</a><b>Three.js <em>Demo</em></b></div>
<div id="box"></div>
<p class="hint">Khối vàng xoay nhẹ — demo three@0.186.1 qua CDN (trang chính không bị ảnh hưởng).</p>
<script type="module">
import * as THREE from 'three';
const holder = document.getElementById('box');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
holder.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c10);
const camera = new THREE.PerspectiveCamera(45,1,0.1,100);
camera.position.set(0,0.6,3.2);
scene.add(new THREE.AmbientLight(0xffffff,0.55));
const key = new THREE.DirectionalLight(0xe0c078,1.6); key.position.set(2,3,4); scene.add(key);
const rim = new THREE.DirectionalLight(0x6074b4,0.5); rim.position.set(-3,-1,-2); scene.add(rim);
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1.2,1.2,1.2),
  new THREE.MeshStandardMaterial({color:0xc8a864,metalness:0.55,roughness:0.32})
);
scene.add(cube);
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(cube.geometry),
  new THREE.LineBasicMaterial({color:0xf0e2b0})
);
cube.add(edges);
function resize(){
  const w = holder.clientWidth, h = holder.clientHeight;
  renderer.setSize(w,h,false); camera.aspect = w/h; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();
renderer.setAnimationLoop((t)=>{
  cube.rotation.x = t/2400; cube.rotation.y = t/1400;
  renderer.render(scene,camera);
});
</script>
</body>
</html>
