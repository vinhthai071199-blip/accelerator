<style>
:root{
  --bg:#0b0c0f;
  --surface:#12141a;
  --surface-2:#181b23;
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.16);
  --text:#f3f4f6;
  --text-2:#9ca3af;
  --text-3:#6b7280;
  --accent:#f59e0b;
  --accent-dim:rgba(245,158,11,.12);
  --cta-bg:#f3f4f6;
  --cta-text:#0b0c0f;
  --r-card:12px;
  --r-sm:8px;
  --ease:cubic-bezier(.22,1,.36,1);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.6;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#272a34;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#383d4b}

.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ===== NAV ===== */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:64px;
  border-bottom:1px solid transparent;
  transition:background-color .2s var(--ease),border-color .2s var(--ease);
}
nav.scrolled{
  background:rgba(11,12,15,.88);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom-color:var(--border);
}
.nav-in{
  height:100%;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.nav-left{display:flex;align-items:center;gap:12px;min-width:0}
.brand{
  display:inline-flex;align-items:center;gap:10px;
  text-decoration:none;color:var(--text);font-weight:600;font-size:15px;letter-spacing:-.01em;
}
.brand img{
  width:32px;height:32px;border-radius:50%;object-fit:cover;
  border:1px solid var(--border-strong);display:block;
}
.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{
  padding:8px 14px;border-radius:var(--r-sm);
  color:var(--text-2);font-size:14px;font-weight:500;
  text-decoration:none;
  transition:color .15s var(--ease),background-color .15s var(--ease);
}
.nav-link:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== MENU MOBILE ===== */
.menu-btn{
  display:none;
  width:36px;height:36px;align-items:center;justify-content:center;
  background:transparent;border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--text);cursor:pointer;
  transition:border-color .15s var(--ease),background-color .15s var(--ease);
}
.menu-btn:hover{background:var(--surface);border-color:var(--border-strong)}
.menu-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.menu-overlay{
  position:fixed;inset:0;z-index:101;
  background:rgba(0,0,0,.65);
  opacity:0;pointer-events:none;
  transition:opacity .2s var(--ease);
}
.menu-overlay.open{opacity:1;pointer-events:auto}
.menu-panel{
  position:fixed;top:0;left:0;bottom:0;z-index:102;
  width:min(280px,82vw);
  background:var(--surface);
  border-right:1px solid var(--border);
  padding:16px;
  transform:translateX(-100%);
  transition:transform .25s var(--ease);
  display:flex;flex-direction:column;gap:4px;
}
.menu-panel.open{transform:translateX(0)}
.mp-head{
  display:flex;align-items:center;gap:10px;
  padding:4px 4px 16px;margin-bottom:8px;
  border-bottom:1px solid var(--border);
}
.mp-head img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid var(--border-strong)}
.mp-head b{font-size:15px;font-weight:600;flex:1;color:var(--text)}
.mp-x{
  width:32px;height:32px;border-radius:var(--r-sm);
  background:transparent;border:1px solid var(--border);color:var(--text-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:color .15s var(--ease),border-color .15s var(--ease);
}
.mp-x:hover{color:var(--text);border-color:var(--border-strong)}
.mp-x:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.menu-panel a{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--r-sm);
  color:var(--text-2);text-decoration:none;font-size:14px;font-weight:500;
  transition:color .15s var(--ease),background-color .15s var(--ease);
}
.menu-panel a:hover{color:var(--text);background:rgba(255,255,255,.06)}

/* ===== HERO ===== */
header{
  padding:104px 0 40px;
  border-bottom:1px solid var(--border);
}
.hero-grid{
  display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap;
}
.hero-main{display:flex;align-items:center;gap:20px;max-width:680px}
.head-avatar{
  width:72px;height:72px;border-radius:50%;object-fit:cover;
  border:1px solid var(--border-strong);flex-shrink:0;display:block;
}
.hero-kicker{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12px;color:var(--text-2);margin-bottom:6px;
}
.live-dot{
  width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;
}
header h1{
  font-size:clamp(28px,4vw,40px);
  font-weight:600;letter-spacing:-.025em;line-height:1.15;
  margin-bottom:8px;color:var(--text);
}
header .lead{
  color:var(--text-2);font-size:15px;font-weight:400;line-height:1.5;
}
.hero-stats{
  display:flex;align-items:center;gap:24px;
  padding:12px 16px;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);
}
.stat-item{display:flex;flex-direction:column;gap:2px}
.stat-val{font-size:18px;font-weight:500;color:var(--text);line-height:1.2}
.stat-lbl{font-size:12px;color:var(--text-3)}
.stat-sep{width:1px;height:28px;background:var(--border)}

/* ===== SECTIONS ===== */
section{padding:48px 0 56px;scroll-margin-top:72px}
section + section{border-top:1px solid var(--border)}
.sec-head{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-bottom:20px;
}
.sec-title{display:flex;align-items:center;gap:10px}
.sec-title .ic{color:var(--accent);width:18px;height:18px}
.sec-title h2{
  font-size:20px;font-weight:600;letter-spacing:-.015em;color:var(--text);
}
.sec-count{
  font-size:12px;color:var(--text-2);
  padding:2px 8px;border-radius:6px;
  background:var(--surface);border:1px solid var(--border);
}

/* ===== CATEGORY FILTER ===== */
.cat-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.cat-bar:empty{display:none}
.chip{
  padding:6px 12px;border-radius:var(--r-sm);
  border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);font-family:inherit;font-size:13px;font-weight:500;
  cursor:pointer;
  transition:color .15s var(--ease),background-color .15s var(--ease),border-color .15s var(--ease);
}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip.on{
  background:var(--cta-bg);color:var(--cta-text);border-color:var(--cta-bg);font-weight:600;
}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== VIDEO GRID ===== */
.vid-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:20px;
}
.vid-card{
  border-radius:var(--r-card);
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:border-color .18s var(--ease),background-color .18s var(--ease);
}
.vid-card:hover{
  border-color:var(--border-strong);
  background:var(--surface-2);
}
.vid-card video{width:100%;display:block;aspect-ratio:16/9;background:#08090c}
.vid-facade{
  aspect-ratio:16/9;
  background:#0e1015;
  display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;
  cursor:pointer;position:relative;overflow:hidden;
  width:100%;border:0;padding:0;font:inherit;color:inherit;
}
.vid-facade.no-poster{
  background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:16px 16px;
}
.vid-facade::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(11,12,15,.1) 0%,rgba(11,12,15,.55) 100%);
  transition:opacity .18s var(--ease);
}
.vid-facade:hover::after{opacity:.75}
.vid-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid-play{
  position:relative;z-index:1;
  width:48px;height:48px;border-radius:50%;
  background:rgba(11,12,15,.78);
  border:1px solid rgba(255,255,255,.24);
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s var(--ease),border-color .15s var(--ease),background-color .15s var(--ease);
}
.vid-facade:hover .vid-play{
  transform:scale(1.06);
  background:rgba(11,12,15,.92);
  border-color:var(--accent);
}
.vid-play svg{width:18px;height:18px;fill:currentColor;margin-left:2px}
.vid-facade:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.vid-note{
  position:relative;z-index:1;
  color:var(--text-2);font-size:12px;
}
.vid-info{
  padding:16px;
  display:flex;flex-direction:column;gap:12px;flex:1;
}
.tag-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cat-tag{
  display:inline-flex;align-items:center;
  font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px;
  background:rgba(255,255,255,.06);color:var(--text-2);border:1px solid var(--border);
}
.cat-tag.cat-main{
  background:var(--accent-dim);color:var(--accent);border-color:rgba(245,158,11,.25);
}
.vid-info h3{
  font-size:15px;font-weight:500;line-height:1.45;
  color:var(--text);word-break:break-word;
  flex:1;
}
.meta{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding-top:12px;border-top:1px solid var(--border);
}
.meta small{color:var(--text-3);font-size:12px}

.btn-dl{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:var(--r-sm);
  background:var(--cta-bg);color:var(--cta-text);
  font-size:13px;font-weight:600;text-decoration:none;
  transition:opacity .15s var(--ease),transform .15s var(--ease);
}
.btn-dl:hover{opacity:.9}
.btn-dl:active{transform:scale(.98)}
.btn-dl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-dl .ic{width:14px;height:14px}

.empty-state{
  grid-column:1/-1;
  padding:32px 16px;text-align:center;
  color:var(--text-3);font-size:14px;
  border:1px dashed var(--border);border-radius:var(--r-card);
}
.skel-card{
  border-radius:var(--r-card);overflow:hidden;
  background:var(--surface);border:1px solid var(--border);
}
.skel-media{aspect-ratio:16/9;background:var(--surface-2)}
.skel-body{padding:16px;display:flex;flex-direction:column;gap:10px}
.skel-line{height:12px;border-radius:6px;background:rgba(255,255,255,.06)}
.skel-line.w-sm{width:32%}
.skel-line.w-md{width:68%}
.skel-line.w-lg{width:90%}

/* ===== LINKS & PHOTOS ===== */
.link-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:16px;
}
.link-card{
  border-radius:var(--r-card);
  overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:border-color .18s var(--ease),background-color .18s var(--ease);
}
.link-card:hover{
  border-color:var(--border-strong);
  background:var(--surface-2);
}
.link-card .photo-wrap{
  display:block;overflow:hidden;background:#08090c;aspect-ratio:16/10;
}
.link-card img{
  width:100%;height:100%;display:block;object-fit:cover;
  transition:transform .25s var(--ease);
}
.link-card:hover img{transform:scale(1.02)}
.link-info{
  padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;
}
.link-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link-ic{
  width:36px;height:36px;border-radius:var(--r-sm);
  background:rgba(255,255,255,.05);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text-2);
}
.link-info h3{
  font-size:15px;font-weight:500;line-height:1.45;
  color:var(--text);word-break:break-word;flex:1;
}
.link-info .meta{justify-content:flex-end}

/* ===== FOOTER ===== */
footer{
  border-top:1px solid var(--border);
  padding:32px 0 44px;
}
.ft-in{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.ft-brand{display:flex;align-items:center;gap:10px}
.ft-brand img{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid var(--border-strong)}
.ft-brand span{font-size:14px;font-weight:600;color:var(--text)}
.ft-links{display:flex;align-items:center;gap:16px;font-size:13px}
.ft-links a{color:var(--text-2);text-decoration:none;transition:color .15s var(--ease)}
.ft-links a:hover{color:var(--text)}
.ft-copy{color:var(--text-3);font-size:12px}

/* ===== RESPONSIVE ===== */
@media(max-width:760px){
  .wrap{padding:0 16px}
  .menu-btn{display:flex}
  .nav-links{display:none}
  header{padding:88px 0 32px}
  .hero-main{align-items:flex-start;gap:16px}
  .head-avatar{width:56px;height:56px}
  .hero-stats{width:100%;justify-content:space-between;gap:12px}
  section{padding:36px 0 44px}
  .vid-grid,.link-grid{grid-template-columns:1fr;gap:16px}
  .ft-in{flex-direction:column;align-items:flex-start}
}
</style>
</head>
<body>

  <div class="wrap nav-in">
    <div class="nav-left">
      <button class="menu-btn" id="menuBtn" onclick="toggleMenu()" aria-label="Mở menu" aria-expanded="false" aria-controls="menuPanel">
        <svg class="ic" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
      <a class="brand" href="#">
        <img src="avatar.jpg" width="32" height="32" alt="Avatar AcceleratorAres">
        <span>AcceleratorAres</span>

    <div class="nav-links">
      <a class="nav-link" href="#videos">Video</a>
      <a class="nav-link" href="#links">Links</a>
      <a class="nav-link" href="#photos">Ảnh</a>
    </div>
  </div>
</nav>

<div class="menu-overlay" id="menuOverlay" onclick="toggleMenu(false)"></div>
<div class="menu-panel" id="menuPanel" role="dialog" aria-label="Menu điều hướng" aria-modal="true">
  <div class="mp-head">
    <img src="avatar.jpg" width="36" height="36" alt="Avatar AcceleratorAres">

    <button class="mp-x" onclick="toggleMenu(false)" aria-label="Đóng menu">
      <svg class="ic" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

  </div>
  <a href="#videos" onclick="toggleMenu(false)">

  <a href="#links" onclick="toggleMenu(false)">

  </a>
  <a href="#photos" onclick="toggleMenu(false)">
    <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
    Ảnh
  </a>
</div>

<header>
  <div class="wrap hero-grid">
    <div class="hero-main">
      <img class="head-avatar" src="avatar.jpg" width="72" height="72" alt="Avatar AcceleratorAres">
      <div>
        <div class="hero-kicker"><span class="live-dot" aria-hidden="true"></span><span>Kho lưu trữ chính thức</span></div>
        <h1>AcceleratorAres</h1>
        <p class="lead">Tổng hợp video Twixtor, preset dựng phim, công cụ và hình ảnh.</p>

      </div>

        <span class="stat-val mono" id="statPhotos">—</span>

</header>

<main>
  <!-- ===== MỤC 1: VIDEO ===== -->
  <section id="videos">
    <div class="wrap">
      <div class="sec-head">
        <div class="sec-title">
          <svg class="ic" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><polygon points="10 9 15 12 10 15 10 9"/></svg>
          <h2>Video</h2>
          <span class="sec-count mono" id="vidCount">0</span>
        </div>
      </div>
      <div class="cat-bar" id="vidCats"></div>

function toggleMenu(force){

  const open = force !== undefined ? force : !p.classList.contains('open');
  p.classList.toggle('open', open);

  o.classList.toggle('open', open);
  b.setAttribute('aria-expanded', open ? 'true' : 'false');
  if(open){
    const first = p.querySelector('a,button');
    if(first) first.focus();
  } else if(document.activeElement && p.contains(document.activeElement)){
    b.focus();
  }
}

/* ============ CHỐNG SPAM CLICK ============ */
function rlGuard(){
  try{
    var KEY='ares_rl', now=Date.now(), arr=[];
    try{ arr=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ arr=[]; }
    arr=arr.filter(function(t){ return now-t<10000; });
    arr.push(now);
    try{ localStorage.setItem(KEY,JSON.stringify(arr)); }catch(e){}
    if(arr.length>8){
      document.documentElement.style.overflow='hidden';
      var d=document.createElement('div');
      d.id='rlLock';
      d.style.cssText='position:fixed;inset:0;z-index:9999;background:#0b0c0f;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;padding:24px';
      d.innerHTML='<svg style="width:40px;height:40px;stroke:#f59e0b;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><b style="color:#f3f4f6;font-size:18px;font-weight:600">Bạn mở liên kết quá nhanh</b><p style="color:#9ca3af;font-size:14px">Chờ <span id="rlSec" class="mono">5</span> giây rồi thử lại.</p>';
      document.body.appendChild(d);
      var s=5;
      var iv=setInterval(function(){
        s--;
        var el=document.getElementById('rlSec');
        if(el) el.textContent=s;
        if(s<=0){
          clearInterval(iv);
          if(d.parentNode) d.parentNode.removeChild(d);
          document.documentElement.style.overflow='';
          try{ localStorage.setItem(KEY,'[]'); }catch(e){}
        }
      },1000);
    }
  }catch(e){}
}

/* ============ FIREBASE & HELPERS ============ */

const FB_DB_URL = 'https://cinevault-ec9d1-default-rtdb.asia-southeast1.firebasedatabase.app';
function fbRef(path, cb, errCb){
  let got = false;
  try{
    firebase.database().ref(path).on('value',
      function(s){ got = true; cb(s.val()); },
      function(e){ if(!got && errCb) errCb(e); });
  }catch(e){ if(errCb) errCb(e); return; }
  setTimeout(function(){
    if(got) return;
    fetch(FB_DB_URL + '/' + path + '.json', {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function(j){ if(!got){ got = true; cb(j); } })
      .catch(function(){ if(!got && errCb) errCb(); });
  }, 300);
}
function esc(s){ const d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtSize(b){
  if(!b && b!==0) return '';
  const u=['B','KB','MB','GB']; let i=0;
  while(b>=1024 && i<3){ b/=1024; i++; }
  return (b>=10||i===0 ? Math.round(b) : b.toFixed(1))+' '+u[i];
}
function dlUrl(u){
  u = u||'';
  if(u.indexOf('fl_attachment')!==-1) return u;
  return u.replace('/upload/','/upload/fl_attachment/');
}
function posterUrl(r){
  if(!r) return '';

  if(!r.public_id) return '';
  return 'https://res.cloudinary.com/'+CLOUD_NAME+'/video/upload/so_0,w_640/'+r.public_id+'.jpg';
}
async function dlFile(el){
  const url = el.getAttribute('data-url'), name = el.getAttribute('data-name') || 'video.mp4';
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('bad');
    const b = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); if(a.parentNode) a.parentNode.removeChild(a); }, 5000);
  }catch(e){ window.open(url, '_blank', 'noopener'); }
  return false;
}
function loadVid(el){
  var url = el.getAttribute('data-url');
  if(!url) return;
  var v = document.createElement('video');
  v.controls = true; v.preload = 'metadata'; v.src = url;
  var poster = el.getAttribute('data-poster');
  if(poster) v.poster = poster;
  v.style.cssText = 'width:100%;display:block;aspect-ratio:16/9;background:#08090c';

const ICON_DL = '<svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

/* ============ CACHE + FAST REST HYDRATION ============ */
const CACHE_KEY = 'ares_cache_v1';
let cacheData = {};
try{ cacheData = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}') || {}; }catch(e){ cacheData = {}; }
function saveCache(k, v){

/* lastHash chỉ dùng để tránh re-render thừa khi RTDB push liên tục.

let homeBase = cacheData.ytServerBase ? String(cacheData.ytServerBase).replace(/\/+$/,'') : '';

  r = r || {};

  return r.url || '';
}
function homePoster(r){
  r = r || {};
  if(r.host === 'home') return (r.poster && homeBase) ? homeBase + r.poster : '';

}
function paintVideos(){
  const box = document.getElementById('vidGrid');
  if(!box || vidLastRaw === null) return;
  const vis = vidLastRaw.filter(function(o){ const x = o[1]||{}; return !x.hidden && !(x.expiresAt && Date.now() > x.expiresAt); });
  const hash = JSON.stringify([homeBase, vis]);
  if(hash === lastHash.videos) return;
  lastHash.videos = hash;
  setCount('vidCount', 'statVideos', vis.length);
  if(!vis.length){
    box.innerHTML = '<div class="empty-state">Chưa có video nào.</div>';
    renderCatBar('vidCats','videos',[]);
    return;
  }
  box.innerHTML = vis.map(function(v){
    const r = v[1]||{};
    const src = homeSrc(r);
    const poster = homePoster(r);
    const cloud = (r.host || 'cloudinary') === 'cloudinary';
    const htag = r.host === 'home' ? 'Ổ cứng' : (r.host === 'catbox' ? 'Catbox' : (r.host === 'litterbox' ? 'Tạm 1h' : 'Cloudinary'));
    const isHome = r.host === 'home';
    const dl = cloud ? dlUrl(src) : (isHome ? (src ? src + '?download=1' : '') : src);
    const fname = (((r.title || 'video').replace(/[^\w\-. ()À-ỹ]+/g, '_').substring(0, 80)) || 'video') + '.mp4';
    const cat = ((r.cat||'').trim());
    const sizeTxt = fmtSize(r.size);
    return '<article class="vid-card" data-cat="'+esc(cat)+'">'
      + '<button type="button" class="vid-facade'+(poster?'':' no-poster')+'" data-url="'+esc(src)+'" data-poster="'+esc(poster)+'" onclick="loadVid(this)" aria-label="Phát video: '+esc(r.title)+'">'
      + (poster ? '<img class="vid-poster" loading="lazy" src="'+esc(poster)+'" alt="'+esc(r.title)+'">' : '')
      + '<div class="vid-play"><svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg></div>'
      + '<div class="vid-note mono">'+(sizeTxt ? 'Phát • '+sizeTxt : 'Phát video')+'</div>'
      + '</button>'
      + '<div class="vid-info">'
      + '<div class="tag-row">'
      + (cat?'<span class="cat-tag cat-main">'+esc(cat)+'</span>':'')
      + '<span class="cat-tag mono">'+htag+'</span>'
      + '</div>'
      + '<h3>'+esc(r.title)+'</h3>'
      + '<div class="meta"><small class="mono">'+esc(sizeTxt || 'MP4')+'</small>'
      + (cloud ? '<a class="btn-dl" href="'+esc(dl)+'" target="_blank" rel="noopener noreferrer">'+ICON_DL+'Tải xuống</a>'
        : (isHome ? '<a class="btn-dl" href="'+esc(dl)+'" target="_blank" rel="noopener noreferrer">'+ICON_DL+'Tải xuống</a>'
        : '<a class="btn-dl" href="'+esc(dl)+'" target="_blank" rel="noopener noreferrer" data-url="'+esc(src)+'" data-name="'+esc(fname)+'" onclick="return dlFile(this)">'+ICON_DL+'Tải xuống</a>'))
      + '</div></div></article>';
  }).join('');
  renderCatBar('vidCats','videos',vis); applyCatFilter('videos');

function applyVideosData(v){
  if(!v){

  vidLastRaw = Object.entries(v).sort(function(a,b){ return (b[1].time||0)-(a[1].time||0); });

}
function applyVideoVisibility(show){
  const els = [document.getElementById('videos')]

    .concat(Array.from(document.querySelectorAll('a[href="#links"]')));

}

/* ============ HYDRATE CACHE -> FAST REST -> REALTIME ============ */
/* Cache hydrate: render ngay nhưng reset hash sau để REST/RTDB không bị block */
if('showVideos' in cacheData) applyVideoVisibility(cacheData.showVideos !== false);
if('showLinks' in cacheData) applyLinksVisibility(cacheData.showLinks !== false);
if('showPhotos' in cacheData) applyPhotosVisibility(cacheData.showPhotos !== false);

if('links' in cacheData){ applyLinksData(cacheData.links); lastHash.links = '__init__'; }
if('photos' in cacheData){ applyPhotosData(cacheData.photos); lastHash.photos = '__init__'; }

function fastRest(path, onVal){
  return fetch(FB_DB_URL + '/' + path + '.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(onVal)
    .catch(function(){});
}
fastRest('videos', function(v){ saveCache('videos', v); applyVideosData(v); });
fastRest('links', function(v){ saveCache('links', v); applyLinksData(v); });
fastRest('photos', function(v){ saveCache('photos', v); applyPhotosData(v); });
fastRest('settings/ytServerBase', function(val){
  saveCache('ytServerBase', val);
  homeBase = val ? String(val).replace(/\/+$/,'') : '';
  paintVideos();
});
fastRest('settings/showVideos', function(v){ saveCache('showVideos', v); applyVideoVisibility(v !== false); });
fastRest('settings/showLinks', function(v){ saveCache('showLinks', v); applyLinksVisibility(v !== false); });
fastRest('settings/showPhotos', function(v){ saveCache('showPhotos', v); applyPhotosVisibility(v !== false); });

(async function initRealtime(){
  try{
    await ensureFb();
    fbRef('settings/ytServerBase', function(val){
      saveCache('ytServerBase', val);
      homeBase = val ? String(val).replace(/\/+$/,'') : '';
      paintVideos();
    });
    fbRef('videos', function(v){ saveCache('videos', v); applyVideosData(v); });
    fbRef('settings/showVideos', function(v){ saveCache('showVideos', v); applyVideoVisibility(v !== false); });
    fbRef('links', function(v){ saveCache('links', v); applyLinksData(v); });
    fbRef('settings/showLinks', function(v){ saveCache('showLinks', v); applyLinksVisibility(v !== false); });
    fbRef('photos', function(v){ saveCache('photos', v); applyPhotosData(v); });
    fbRef('settings/showPhotos', function(v){ saveCache('showPhotos', v); applyPhotosVisibility(v !== false); });
  }catch(e){}
})();

/* ============ CATEGORY FILTER ============ */
const catFilter = {videos:'', links:'', photos:''};
function renderCatBar(barId, sec, list){
  const bar = document.getElementById(barId);
  if(!bar) return;
  const seen = {};
  list.forEach(function(x){ const c = (((x[1]||{}).cat)||'').trim(); if(c) seen[c] = 1; });
  const cats = Object.keys(seen).sort();
  if(!cats.length){ bar.innerHTML = ''; return; }
  let h = '<button class="chip'+(catFilter[sec]?'':' on')+'" data-cat="">Tất cả</button>';
  cats.forEach(function(c){
    h += '<button class="chip'+(catFilter[sec]===c?' on':'')+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>';
  });
  bar.innerHTML = h;
  bar.querySelectorAll('.chip').forEach(function(b){
    b.onclick = function(){ catFilter[sec] = b.getAttribute('data-cat')||''; applyCatFilter(sec); };
  });
}
function applyCatFilter(sec){
  const map = {videos:['vidCats','vidGrid'], links:['linkCats','linkGrid'], photos:['photoCats','photoGrid']};
  const m = map[sec]; if(!m) return;
  const bar = document.getElementById(m[0]), grid = document.getElementById(m[1]);
  if(bar) bar.querySelectorAll('.chip').forEach(function(b){ b.classList.toggle('on', (b.getAttribute('data-cat')||'')===catFilter[sec]); });
  if(grid) grid.querySelectorAll('[data-cat]').forEach(function(card){
    card.style.display = (!catFilter[sec] || (card.getAttribute('data-cat')||'')===catFilter[sec]) ? '' : 'none';
  });
}
</script>
</body>
